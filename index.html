<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdullah Live TV</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans antialiased h-screen flex flex-col">

    <header class="bg-slate-800 p-4 text-center shadow-lg border-b border-red-500 shrink-0">
        <h1 class="text-2xl font-bold text-red-500">📺 Abdullah's All Channels TV</h1>
        <p class="text-xs text-gray-400 mt-1">Automatic M3U List Player</p>
    </header>

    <div class="flex flex-col md:flex-row flex-1 overflow-hidden">
        
        <div class="flex-1 bg-black flex items-center justify-center p-4">
            <div id="player" class="w-full max-w-4xl aspect-video rounded-lg overflow-hidden shadow-2xl"></div>
        </div>

        <div class="w-full md:w-80 bg-slate-800 p-4 flex flex-col border-t md:border-t-0 md:border-l border-slate-700 shrink-0 h-full">
            <h3 class="font-semibold text-lg border-b border-slate-600 pb-2 mb-4 text-slate-300">All Channels (<span id="count">0</span>)</h3>
            
            <input type="text" id="search" oninput="filterChannels()" placeholder="Search channel..." class="w-full bg-slate-700 text-white p-2 rounded mb-3 text-sm focus:outline-none focus:ring-1 focus:ring-red-500">
            
            <div id="channel-list" class="space-y-2 overflow-y-auto flex-1 pr-1 pb-20">
                </div>
        </div>

    </div>

    <script>
        // Apnar M3U link ekhane bshano hoyeche, eta automatic shob pull korbe
        const m3uUrl = "https://is.gd/stablesportstv";

        var player;
        var channels = [];

        async function loadM3U() {
            try {
                // GitHub Pages theke external link fetch korte ektu proxy lagte pare
                const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(m3uUrl);
                const response = await fetch(proxyUrl);
                const data = await response.text();
                parseM3U(data);
            } catch (error) {
                console.error("Error loading M3U:", error);
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            let currentChannel = null;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameMatch = line.split(',')[1];
                    currentChannel = {
                        name: nameMatch ? nameMatch.trim() : "Live Channel",
                        url: ""
                    };
                } else if (line.startsWith('http') && currentChannel) {
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = null;
                }
            }
            displayChannels(channels);
        }

        function displayChannels(list) {
            const container = document.getElementById('channel-list');
            container.innerHTML = '';
            document.getElementById('count').innerText = list.length;

            list.forEach((channel) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-slate-700 hover:bg-red-600 p-3 rounded-md transition text-sm font-medium block truncate";
                btn.innerHTML = `🎥 ${channel.name}`;
                btn.onclick = () => playChannel(channel.url);
                container.appendChild(btn);
            });

            if (list.length > 0 && !player) {
                playChannel(list[0].url);
            }
        }

        function filterChannels() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = channels.filter(c => c.name.toLowerCase().includes(query));
            displayChannels(filtered);
        }

        // Play Video
        function playChannel(url) {
            if (player) { player.destroy(); }
            player = new Clappr.Player({
                source: url,
                parentId: "#player",
                width: "100%",
                height: "100%",
                autoPlay: true,
                mimeType: "application/x-mpegURL"
            });
        }

        window.onload = loadM3U;
    </script>
</body>
</html>
