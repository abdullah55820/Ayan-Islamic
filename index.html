<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>My Music Player</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">

<link rel="preload"
as="image"
href="background.jpg">

<link rel="apple-touch-icon"
sizes="180x180"
href="logo.png">

<link rel="icon"
type="image/png"
href="logo.png">


<style>

/* =====================================================
   RESET
===================================================== */

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{

margin:0;

width:100%;
height:100%;

overflow:hidden;

background:#050505;

color:#fff;

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"Segoe UI",
sans-serif;
}

body{
position:relative;
}


/* =====================================================
   BACKGROUND
===================================================== */

.bg{

position:fixed;

inset:0;

background-image:
url("background.jpg");

background-position:center center;

background-size:cover;

background-repeat:no-repeat;

z-index:0;
}

.bg::after{

content:"";

position:absolute;

inset:0;

background:
rgba(0,0,0,.16);
}


/* =====================================================
   TOP
===================================================== */

.top-widgets{

position:fixed;

top:12px;

left:50%;

transform:
translateX(-50%);

z-index:20;

display:flex;

align-items:center;

justify-content:center;
}


/* BD TIME */

.bd-time{

padding:
5px 11px;

border-radius:20px;

background:
rgba(0,0,0,.42);

border:
1px solid
rgba(255,255,255,.17);

color:
rgba(255,255,255,.9);

font-size:10px;

font-weight:600;

letter-spacing:.3px;

backdrop-filter:
blur(14px);

-webkit-backdrop-filter:
blur(14px);

display:flex;

align-items:center;

gap:6px;
}


.live-dot{

width:6px;

height:6px;

background:#ff3b30;

border-radius:50%;

box-shadow:
0 0 8px #ff3b30;

animation:
pulse 1.5s infinite;
}

@keyframes pulse{

0%{
opacity:1;
transform:scale(1);
}

50%{
opacity:.35;
transform:scale(.8);
}

100%{
opacity:1;
transform:scale(1);
}

}


/* =====================================================
   YOUTUBE
===================================================== */

#yt{

position:fixed;

width:2px;
height:2px;

left:-10px;
bottom:-10px;

opacity:.01;

pointer-events:none;
}


/* =====================================================
   MAIN
===================================================== */

.app{

position:relative;

z-index:2;

height:100dvh;

width:100%;

display:flex;

flex-direction:column;

align-items:center;

padding:
50px 14px 18px;
}


/* =====================================================
   CLEAN PLAYLIST
===================================================== */

.playlist{

width:min(440px,94%);

flex:1;

min-height:0;

display:flex;

flex-direction:column;

margin-bottom:10px;
}


/* -----------------------------------------------------
   PLAYLIST HEADER
----------------------------------------------------- */

.playlist-header{

display:flex;

align-items:center;

justify-content:space-between;

padding:
4px 7px 9px;

flex-shrink:0;
}


.playlist-name{

font-size:12px;

font-weight:700;

letter-spacing:.2px;

color:
rgba(255,255,255,.88);
}


.playlist-count{

font-size:9px;

font-weight:500;

color:
rgba(255,255,255,.48);
}


/* -----------------------------------------------------
   SONG LIST
----------------------------------------------------- */

.song-list{

flex:1;

min-height:0;

overflow-y:auto;

display:flex;

flex-direction:column;

padding:
0 3px 5px;

scroll-behavior:smooth;

-webkit-overflow-scrolling:touch;

overscroll-behavior:contain;
}

.song-list::-webkit-scrollbar{
width:2px;
}

.song-list::-webkit-scrollbar-thumb{

background:
rgba(255,255,255,.25);

border-radius:10px;
}


/* =====================================================
   SONG
===================================================== */

.song-item{

position:relative;

height:54px;

min-height:54px;

display:flex;

align-items:center;

padding:
5px 7px;

gap:10px;

border-radius:13px;

background:
rgba(255,255,255,.035);

border:
1px solid
transparent;

cursor:pointer;

transition:
background .2s ease,
border .2s ease,
transform .15s ease;
}


.song-item + .song-item{
margin-top:3px;
}


.song-item:active{

transform:
scale(.985);

background:
rgba(255,255,255,.08);
}


/* CURRENT */

.song-item.active{

background:
rgba(255,255,255,.105);

border-color:
rgba(255,255,255,.16);
}


/* SMALL ACTIVE LINE */

.song-item.active::before{

content:"";

position:absolute;

left:0;

top:15px;

bottom:15px;

width:2px;

border-radius:4px;

background:#fff;

box-shadow:
0 0 8px
rgba(255,255,255,.65);
}


/* =====================================================
   NUMBER
===================================================== */

.song-number{

width:18px;

font-size:8px;

color:
rgba(255,255,255,.38);

text-align:center;

flex-shrink:0;
}

.song-item.active .song-number{

color:
rgba(255,255,255,.8);
}


/* =====================================================
   THUMB
===================================================== */

.song-thumb{

width:40px;

height:40px;

border-radius:8px;

overflow:hidden;

flex-shrink:0;

background:#222;

box-shadow:
0 2px 8px
rgba(0,0,0,.3);
}

.song-thumb img{

width:100%;
height:100%;

object-fit:cover;

display:block;
}


/* =====================================================
   SONG INFO
===================================================== */

.song-info{

flex:1;

min-width:0;

display:flex;

flex-direction:column;

justify-content:center;
}


.song-title{

font-size:11px;

font-weight:650;

color:#fff;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;
}


.song-artist{

font-size:8.5px;

color:
rgba(255,255,255,.48);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:3px;
}


/* =====================================================
   MINI EQUALIZER
===================================================== */

.equalizer{

width:18px;

height:17px;

display:flex;

align-items:flex-end;

justify-content:flex-end;

gap:2px;

opacity:0;

margin-right:3px;

flex-shrink:0;
}

.equalizer span{

width:2px;

height:5px;

border-radius:3px;

background:#fff;
}


.song-item.active .equalizer{

opacity:1;
}


.song-item.active .equalizer span:nth-child(1){

animation:
eq1 .7s infinite alternate ease-in-out;
}

.song-item.active .equalizer span:nth-child(2){

animation:
eq2 .5s infinite alternate ease-in-out;
}

.song-item.active .equalizer span:nth-child(3){

animation:
eq3 .8s infinite alternate ease-in-out;
}


@keyframes eq1{

from{
height:4px;
}

to{
height:12px;
}

}

@keyframes eq2{

from{
height:7px;
}

to{
height:16px;
}

}

@keyframes eq3{

from{
height:3px;
}

to{
height:10px;
}

}


/* =====================================================
   PLAYER
===================================================== */

.player{

width:min(440px,94%);

height:120px;

padding:
14px 18px;

border:
1px solid
rgba(255,255,255,.18);

border-radius:60px;

background:
rgba(255,255,255,.06);

backdrop-filter:
blur(25px)
saturate(115%);

-webkit-backdrop-filter:
blur(25px)
saturate(115%);

box-shadow:
0 20px 50px
rgba(0,0,0,.35);

display:flex;

align-items:center;

gap:12px;

position:relative;

overflow:hidden;

flex-shrink:0;

touch-action:pan-y;
}


/* =====================================================
   COVER
===================================================== */

.cover-wrapper{

position:relative;

width:84px;
height:84px;

flex-shrink:0;

display:flex;

align-items:center;
justify-content:center;

border-radius:50%;

overflow:hidden;

border:
1px solid
rgba(255,255,255,.3);
}


.cover{

width:137%;
height:137%;

margin:-18.5%;

border-radius:50%;

object-fit:cover;

object-position:center;

background:#222;

animation:
spin 8s linear infinite;

animation-play-state:paused;
}

.cover.spinning{

animation-play-state:running;
}


.cover-wrapper::after{

content:"";

position:absolute;

width:16px;
height:16px;

background:
rgba(20,20,20,.85);

border:
2px solid
rgba(255,255,255,.3);

border-radius:50%;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

z-index:2;
}


@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}


/* =====================================================
   PLAYER INFO
===================================================== */

.middle{

flex:1;

min-width:0;

display:flex;

flex-direction:column;

justify-content:center;
}


.title{

font-size:16px;

font-weight:700;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

color:#fff;

letter-spacing:.2px;
}


.artist{

font-size:12px;

color:
rgba(255,255,255,.65);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:2px;

margin-bottom:8px;
}


/* =====================================================
   SEEK
===================================================== */

.seek{

position:relative;

width:100%;

height:5px;

border-radius:10px;

background:
rgba(255,255,255,.2);

cursor:pointer;

margin-bottom:6px;

touch-action:none;

user-select:none;

-webkit-user-select:none;
}

.seek::before{

content:"";

position:absolute;

top:-12px;
bottom:-12px;

left:-10px;
right:-10px;

z-index:1;
}


.fill{

position:absolute;

left:0;
top:0;

height:100%;

width:0;

background:#fff;

border-radius:10px;

pointer-events:none;

z-index:2;
}


.time-display{

font-size:11px;

color:
rgba(255,255,255,.65);

font-variant-numeric:tabular-nums;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{

display:flex;

align-items:center;

gap:8px;

flex-shrink:0;
}


.btn{

width:28px;
height:28px;

border:0;

background:transparent;

color:
rgba(255,255,255,.9);

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

padding:0;
}


.btn svg{

width:20px;
height:20px;

fill:#fff;
}


.skip-btn{

width:28px;
height:28px;

border:0;

background:transparent;

color:#fff;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

padding:0;

flex-shrink:0;

transition:
transform .15s;
}


.skip-btn svg{

width:19px;
height:19px;

fill:#fff;
}

.skip-btn:active{

transform:
scale(.88);
}


/* PLAY */

.play{

width:44px;
height:44px;

border-radius:50%;

border:0;

background:#fff;

color:#000;

display:flex;

align-items:center;

justify-content:center;

box-shadow:
0 4px 15px
rgba(0,0,0,.3);

cursor:pointer;

flex-shrink:0;
}


.play svg{

width:20px;
height:20px;

fill:#000;

margin-left:2px;
}

.play.playing svg{
margin-left:0;
}


.play:active{

transform:
scale(.90);
}


/* =====================================================
   VOLUME
===================================================== */

.vol-container{

display:flex;

align-items:center;

gap:4px;

background:
rgba(0,0,0,.25);

border:
1px solid
rgba(255,255,255,.15);

padding:
4px 6px;

border-radius:20px;

backdrop-filter:
blur(10px);

-webkit-backdrop-filter:
blur(10px);
}


.vol-slider-wrapper{

width:0;

overflow:hidden;

opacity:0;

display:flex;

align-items:center;

transition:
width .28s cubic-bezier(.2,.8,.2,1),
opacity .2s ease;
}


.vol-slider-wrapper.active{

width:55px;

opacity:1;

margin-left:2px;
}


.vol-slider{

-webkit-appearance:none;

appearance:none;

width:55px;

height:3.5px;

background:
rgba(255,255,255,.3);

border-radius:10px;

outline:none;

cursor:pointer;
}


.vol-slider::-webkit-slider-thumb{

-webkit-appearance:none;

appearance:none;

width:10px;
height:10px;

border-radius:50%;

background:#fff;

cursor:pointer;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:480px){

.app{

padding:
48px
10px
12px;
}


.playlist{

width:96%;

margin-bottom:8px;
}


.playlist-header{

padding:
4px 6px 7px;
}


.playlist-name{

font-size:11px;
}


.playlist-count{

font-size:8px;
}


.song-list{

padding:
0 2px 4px;
}


.song-item{

height:51px;

min-height:51px;

padding:
5px 6px;

gap:8px;

border-radius:11px;
}


.song-item + .song-item{

margin-top:2px;
}


.song-thumb{

width:37px;
height:37px;

border-radius:7px;
}


.song-number{

width:15px;

font-size:7.5px;
}


.song-title{

font-size:10px;
}


.song-artist{

font-size:8px;

margin-top:2px;
}


.player{

height:116px;

padding:
12px 14px;

border-radius:58px;

gap:10px;
}


.cover-wrapper{

width:76px;
height:76px;
}


.title{

font-size:15px;
}


.artist{

font-size:11px;
}


.play{

width:42px;
height:42px;
}


.top-widgets{

top:8px;
}


.bd-time{

font-size:10px;

padding:
4px 9px;
}

}


/* =====================================================
   SMALL HEIGHT
===================================================== */

@media(max-height:700px) and (max-width:480px){

.app{

padding-top:46px;
padding-bottom:8px;
}


.song-item{

height:47px;

min-height:47px;
}


.song-thumb{

width:34px;
height:34px;
}


.player{

height:105px;
}


.cover-wrapper{

width:68px;
height:68px;
}

}


/* =====================================================
   IOS
===================================================== */

@supports (-webkit-touch-callout:none){

.vol-container{

display:none!important;

}

}

</style>

</head>

"

Loading songs...

</div>

     PLAYER

class="player"
id="playerCard"
>

>

YouTube Music

></div>

0:00

/

0:00
</span>

>

"/>

>

>

onclick="nextSong()"
aria-label="Next"
>

M4 6.5v11l10-5.5z
"/>

<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =====================================================
   PLAYLIST
===================================================== */

const PLAYLIST_ID="PLB9TgDHfMHmM";

let player=null;

let playing=false;

let playlistItems=[];


/* =====================================================
   BD TIME
===================================================== */

function updateBDTime(){

const options={

timeZone:"Asia/Dhaka",

hour:"2-digit",

minute:"2-digit",

second:"2-digit",

hour12:true

};

document.getElementById("bdTimeVal").textContent=

new Intl.DateTimeFormat(
"en-US",
options
).format(new Date());

}

updateBDTime();

setInterval(
updateBDTime,
1000
);


/* =====================================================
   YOUTUBE API
===================================================== */

function onYouTubeIframeAPIReady(){

player=new YT.Player(
"yt",
{

width:"2",

height:"2",

playerVars:{

autoplay:0,

controls:0,

disablekb:1,

fs:0,

modestbranding:1,

playsinline:1,

rel:0,

listType:"playlist",

list:PLAYLIST_ID

},

events:{

onReady:ready,

onStateChange:state

}

});

}


/* =====================================================
   READY
===================================================== */

function ready(){

loadPlaylistItems();

setInterval(
updateProgress,
250
);

}


/* =====================================================
   STATE
===================================================== */

function state(e){

const cover=
document.getElementById("cover");

const playBtn=
document.getElementById("play");

const playIcon=
document.getElementById("play-icon");


highlightActiveTrack();


if(
e.data===YT.PlayerState.PLAYING
){

playing=true;

playBtn.classList.add("playing");

playIcon.innerHTML=
`
<path d="
M6 19h4V5H6v14zm8-14v14h4V5h-4z
"/>
`;

cover.classList.add("spinning");

updateInfo();

}


else if(

e.data===YT.PlayerState.PAUSED ||

e.data===YT.PlayerState.ENDED

){

playing=false;

playBtn.classList.remove("playing");

playIcon.innerHTML=
`
<path d="
M8 5v14l11-7z
"/>
`;

cover.classList.remove("spinning");

}

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

function togglePlay(){

if(!player)
return;

if(playing){

player.pauseVideo();

}

else{

player.playVideo();

}

}


/* =====================================================
   NEXT
===================================================== */

function nextSong(){

if(
!player ||
playlistItems.length===0
)
return;


const current=
player.getPlaylistIndex();


const next=
(current+1)%
playlistItems.length;


forceUpdateUI(next);

player.playVideoAt(next);

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousSong(){

if(
!player ||
playlistItems.length===0
)
return;


const current=
player.getPlaylistIndex();


const previous=
(current-1+
playlistItems.length)%
playlistItems.length;


forceUpdateUI(previous);

player.playVideoAt(previous);

}


/* =====================================================
   FORCE UI
===================================================== */

function forceUpdateUI(index){

if(
!playlistItems[index]
)
return;


const id=
playlistItems[index];


document.getElementById("cover").src=

`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;


const title=
document.getElementById(
`title-${index}`
);


const artist=
document.getElementById(
`artist-${index}`
);


if(title){

document.getElementById("title")
.textContent=
title.textContent;

}


if(artist){

document.getElementById("artist")
.textContent=
artist.textContent;

}


highlightActiveTrack();

}


/* =====================================================
   VOLUME
===================================================== */

let volTimer=null;


function resetVolTimer(){

if(volTimer)
clearTimeout(volTimer);


volTimer=setTimeout(()=>{

document
.getElementById("volWrapper")
.classList.remove("active");

},3000);

}


function toggleVolume(){

const wrapper=
document.getElementById("volWrapper");


if(
wrapper.classList.contains("active")
){

wrapper.classList.remove("active");

if(volTimer)
clearTimeout(volTimer);

}

else{

wrapper.classList.add("active");

resetVolTimer();

}

}


function changeVolume(val){

if(
player &&
typeof player.setVolume==="function"
){

player.setVolume(val);

}

resetVolTimer();

}


/* =====================================================
   SEEK
===================================================== */

let isDragging=false;

let seekPointerId=null;


const seekElement=
document.getElementById("seek");


function getSeekPosition(clientX){

const rect=
seekElement.getBoundingClientRect();


if(!rect.width)
return 0;


return Math.max(
0,
Math.min(
1,
(clientX-rect.left)/
rect.width
)
);

}


function updateSeekVisual(pos){

document.getElementById("fill")
.style.width=
(pos*100)+"%";


if(
player &&
typeof player.getDuration==="function"
){

const duration=
player.getDuration();


if(duration){

document.getElementById("current")
.textContent=
format(pos*duration);

document.getElementById("duration")
.textContent=
format(duration);

}

}

}


/* START */

seekElement.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

e.stopPropagation();

isDragging=true;

seekPointerId=e.pointerId;


try{

seekElement.setPointerCapture(
e.pointerId
);

}catch(err){}


updateSeekVisual(
getSeekPosition(e.clientX)
);

},
{
passive:false
}
);


/* MOVE */

seekElement.addEventListener(
"pointermove",
e=>{

if(!isDragging)
return;


e.preventDefault();

e.stopPropagation();


updateSeekVisual(
getSeekPosition(e.clientX)
);

},
{
passive:false
}
);


/* END */

seekElement.addEventListener(
"pointerup",
e=>{

if(!isDragging)
return;


e.preventDefault();

e.stopPropagation();


const pos=
getSeekPosition(e.clientX);


updateSeekVisual(pos);


if(
player &&
typeof player.getDuration==="function"
){

const duration=
player.getDuration();


if(duration){

player.seekTo(
pos*duration,
true
);

}

}


isDragging=false;

seekPointerId=null;


try{

seekElement.releasePointerCapture(
e.pointerId
);

}catch(err){}

},
{
passive:false
}
);


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

if(isDragging)
return;


if(
!player ||
typeof player.getCurrentTime!=="function"
)
return;


try{

const current=
player.getCurrentTime();

const duration=
player.getDuration();


if(!duration)
return;


const pos=
Math.max(
0,
Math.min(
1,
current/duration
)
);


document.getElementById("fill")
.style.width=
(pos*100)+"%";


document.getElementById("current")
.textContent=
format(current);


document.getElementById("duration")
.textContent=
format(duration);


}catch(e){}

}


/* =====================================================
   FORMAT
===================================================== */

function format(s){

if(
!s ||
isNaN(s)
)
return "0:00";


s=Math.floor(s);


return Math.floor(s/60)
+
":"
+
String(
s%60
).padStart(2,"0");

}


/* =====================================================
   LOAD PLAYLIST
===================================================== */

function loadPlaylistItems(){

if(
!player ||
typeof player.getPlaylist!=="function"
)
return;


playlistItems=
player.getPlaylist();


const list=
document.getElementById("songList");


const count=
document.getElementById("songCount");


if(
!playlistItems ||
playlistItems.length===0
){

list.innerHTML=
`
<div style="
text-align:center;
color:rgba(255,255,255,.55);
font-size:10px;
padding-top:20px;
">
No songs found
</div>
`;

count.textContent=
"0 Songs";

return;

}


count.textContent=
playlistItems.length+
(
playlistItems.length===1
?
" Song"
:
" Songs"
);


list.innerHTML="";


playlistItems.forEach(
(id,index)=>{

const item=
document.createElement("div");


item.className=
"song-item";


item.id=
`track-${index}`;


item.onclick=()=>{

playSpecificTrack(index);

};


item.innerHTML=
`

<div class="song-number">

${index+1}

</div>


<div class="song-thumb">

<img
src="https://i.ytimg.com/vi/${id}/hqdefault.jpg"
alt=""
loading="lazy"
>

</div>


<div class="song-info">

<div
class="song-title"
id="title-${index}"
>
Track #${index+1}
</div>

<div
class="song-artist"
id="artist-${index}"
>
YouTube Music
</div>

</div>


<div class="equalizer">

<span></span>
<span></span>
<span></span>

</div>

`;


list.appendChild(item);


fetchSongDetails(
id,
index
);

});


highlightActiveTrack();

updateInfo();

}


/* =====================================================
   SONG DETAILS
===================================================== */

function fetchSongDetails(
id,
index
){

fetch(
`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
)

.then(
r=>r.json()
)

.then(
data=>{

if(!data)
return;


const title=
document.getElementById(
`title-${index}`
);


const artist=
document.getElementById(
`artist-${index}`
);


if(
title &&
data.title
){

title.textContent=
data.title;

}


if(
artist &&
data.author_name
){

artist.textContent=
data.author_name;

}

})

.catch(
()=>{}
);

}


/* =====================================================
   PLAY SPECIFIC
===================================================== */

function playSpecificTrack(index){

if(
!player
)
return;


if(
!playlistItems[index]
)
return;


forceUpdateUI(index);


player.playVideoAt(index);


/* Keep selected song visible */

setTimeout(()=>{

const item=
document.getElementById(
`track-${index}`
);

if(item){

item.scrollIntoView({

behavior:"smooth",

block:"nearest"

});

}

},100);

}


/* =====================================================
   ACTIVE
===================================================== */

function highlightActiveTrack(){

if(
!player ||
typeof player.getPlaylistIndex!=="function"
)
return;


const current=
player.getPlaylistIndex();


document
.querySelectorAll(".song-item")
.forEach(
(item,index)=>{

item.classList.toggle(
"active",
index===current
);

});

}


/* =====================================================
   INFO
===================================================== */

function updateInfo(){

if(
!player ||
typeof player.getVideoData!=="function"
)
return;


try{

const d=
player.getVideoData();


if(
!d ||
!d.video_id
)
return;


document.getElementById("cover").src=

`https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`;


if(d.title){

document.getElementById("title")
.textContent=
d.title;

}


if(d.author){

document.getElementById("artist")
.textContent=
d.author;

}

}catch(e){}

}


/* =====================================================
   SWIPE
===================================================== */

let swipeStartX=0;

let swipeStartY=0;

let swipeActive=false;

let swipeFromSeek=false;


const playerCard=
document.getElementById("playerCard");


playerCard.addEventListener(
"pointerdown",
e=>{

swipeStartX=e.clientX;

swipeStartY=e.clientY;

swipeFromSeek=
!!e.target.closest("#seek");

swipeActive=true;


if(swipeFromSeek){

e.stopPropagation();

}

});


playerCard.addEventListener(
"pointerup",
e=>{

if(!swipeActive)
return;


const dx=
e.clientX-swipeStartX;


const dy=
e.clientY-swipeStartY;


if(swipeFromSeek){

swipeActive=false;

return;

}


if(
Math.abs(dx)<50
){

swipeActive=false;

return;

}


if(
Math.abs(dy)>
Math.abs(dx)
){

swipeActive=false;

return;

}


if(dx<0){

nextSong();

}

else{

previousSong();

}


swipeActive=false;

});


playerCard.addEventListener(
"pointercancel",
()=>{

swipeActive=false;

});

</script>

</body>
</html>
