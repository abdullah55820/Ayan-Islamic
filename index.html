<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>My Music Player</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preload" as="image" href="background.jpg">

<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">

<style>

/* =========================================================
   RESET
   ========================================================= */

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#050505;
color:#fff;
font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"Segoe UI",
sans-serif;
}

body{
position:relative;
overflow-x:hidden!important;
}


/* =========================================================
   BACKGROUND
   ========================================================= */

.bg{
position:fixed;
inset:0;

background-image:url("background.jpg");
background-position:center center;
background-size:cover;
background-repeat:no-repeat;

z-index:0;
}

.bg::after{
content:"";
position:absolute;
inset:0;

background:
linear-gradient(
180deg,
rgba(0,0,0,.30),
rgba(0,0,0,.10) 35%,
rgba(0,0,0,.50)
);

}


/* =========================================================
   TOP
   ========================================================= */

.top-widgets{

position:fixed;

top:12px;
left:50%;

transform:translateX(-50%);

z-index:20;

display:flex;
align-items:center;
justify-content:center;

}

.bd-time{

padding:6px 12px;

border-radius:22px;

background:rgba(0,0,0,.40);

border:1px solid rgba(255,255,255,.18);

box-shadow:
0 8px 30px rgba(0,0,0,.20);

color:rgba(255,255,255,.92);

font-size:11px;
font-weight:600;

letter-spacing:.3px;

backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

display:flex;
align-items:center;
gap:6px;
}

.live-dot{

width:7px;
height:7px;

border-radius:50%;

background:#ff3b30;

box-shadow:
0 0 10px rgba(255,59,48,.8);

animation:pulse 1.5s infinite;
}

@keyframes pulse{

0%{
opacity:1;
transform:scale(1);
}

50%{
opacity:.35;
transform:scale(.8);
}

100%{
opacity:1;
transform:scale(1);
}

}


/* =========================================================
   YOUTUBE
   ========================================================= */

#yt{

position:fixed;

width:2px;
height:2px;

left:-10px;
bottom:-10px;

opacity:.01;

pointer-events:none;

}


/* =========================================================
   MAIN AREA
   ========================================================= */

.app{

position:relative;

z-index:2;

height:100dvh;
width:100%;

display:flex;

flex-direction:column;

align-items:center;

padding:
62px
16px
24px;

}


/* =========================================================
   PLAYLIST LIBRARY
   ========================================================= */

.music-library{

width:min(440px,94%);

flex:1;

min-height:0;

display:flex;

flex-direction:column;

margin-bottom:16px;

}


/* HEADER */

.library-header{

display:flex;

align-items:flex-end;

justify-content:space-between;

padding:
0 8px
10px;

flex-shrink:0;
}

.library-left{

display:flex;

flex-direction:column;

gap:2px;
}

.library-title{

font-size:21px;

font-weight:750;

letter-spacing:-.4px;

color:#fff;

text-shadow:
0 2px 15px rgba(0,0,0,.4);
}

.library-subtitle{

font-size:10px;

font-weight:500;

color:rgba(255,255,255,.58);

letter-spacing:.2px;
}

.song-count{

font-size:10px;

font-weight:600;

color:rgba(255,255,255,.65);

background:rgba(0,0,0,.30);

border:
1px solid
rgba(255,255,255,.13);

padding:5px 9px;

border-radius:15px;

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
}


/* =========================================================
   SONG LIST
   ========================================================= */

.song-list{

flex:1;

min-height:0;

overflow-y:auto;

display:flex;

flex-direction:column;

gap:8px;

padding:
2px
3px
8px;

scroll-behavior:smooth;

-webkit-overflow-scrolling:touch;

overscroll-behavior:contain;
}

.song-list::-webkit-scrollbar{
width:2px;
}

.song-list::-webkit-scrollbar-thumb{

background:
rgba(255,255,255,.25);

border-radius:10px;
}


/* =========================================================
   SONG CARD
   ========================================================= */

.song-item{

position:relative;

display:flex;

align-items:center;

gap:11px;

width:100%;

min-height:64px;

padding:8px 10px;

border-radius:18px;

background:
rgba(255,255,255,.075);

border:
1px solid
rgba(255,255,255,.10);

box-shadow:
0 8px 25px rgba(0,0,0,.13);

backdrop-filter:blur(18px) saturate(120%);
-webkit-backdrop-filter:blur(18px) saturate(120%);

cursor:pointer;

overflow:hidden;

transition:
transform .25s cubic-bezier(.2,.8,.2,1),
background .25s ease,
border .25s ease,
box-shadow .25s ease;

animation:
songAppear .45s ease both;
}

@keyframes songAppear{

from{
opacity:0;
transform:translateY(12px) scale(.98);
}

to{
opacity:1;
transform:translateY(0) scale(1);
}

}


/* TOUCH */

.song-item:active{

transform:
scale(.965);

background:
rgba(255,255,255,.13);
}


/* CURRENT */

.song-item.active{

background:
rgba(255,255,255,.17);

border-color:
rgba(255,255,255,.30);

box-shadow:
0 10px 35px rgba(0,0,0,.22),
inset 0 0 25px rgba(255,255,255,.035);

}


/* CURRENT LIGHT */

.song-item.active::before{

content:"";

position:absolute;

left:0;
top:12px;
bottom:12px;

width:3px;

border-radius:5px;

background:#fff;

box-shadow:
0 0 12px rgba(255,255,255,.9);

}


/* =========================================================
   NUMBER
   ========================================================= */

.song-number{

width:19px;

font-size:9px;

font-weight:700;

text-align:center;

color:rgba(255,255,255,.42);

flex-shrink:0;
}

.song-item.active .song-number{

color:#fff;
}


/* =========================================================
   THUMB
   ========================================================= */

.song-thumb-wrap{

position:relative;

width:48px;
height:48px;

border-radius:12px;

overflow:hidden;

flex-shrink:0;

background:#111;

box-shadow:
0 5px 14px rgba(0,0,0,.30);
}

.song-item img{

width:100%;
height:100%;

display:block;

object-fit:cover;

transition:
transform .4s ease;
}

.song-item:active img{

transform:scale(1.06);
}


/* PLAY OVERLAY */

.thumb-play{

position:absolute;

inset:0;

display:flex;

align-items:center;
justify-content:center;

background:
rgba(0,0,0,.18);

opacity:0;

transition:opacity .2s ease;
}

.song-item:hover .thumb-play{

opacity:1;
}

.thumb-play svg{

width:18px;
height:18px;

fill:#fff;

filter:
drop-shadow(0 2px 5px rgba(0,0,0,.5));
}


/* CURRENT THUMB */

.song-item.active .thumb-play{

opacity:1;

background:
rgba(0,0,0,.28);
}


/* =========================================================
   SONG INFO
   ========================================================= */

.song-item-info{

flex:1;

min-width:0;

display:flex;

flex-direction:column;

justify-content:center;

gap:3px;
}

.song-item-title{

font-size:12px;

font-weight:700;

color:#fff;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

letter-spacing:.05px;
}

.song-item-artist{

font-size:9.5px;

font-weight:500;

color:rgba(255,255,255,.55);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;
}


/* =========================================================
   EQUALIZER
   ========================================================= */

.equalizer{

width:20px;
height:22px;

display:flex;

align-items:flex-end;

justify-content:center;

gap:2px;

margin-right:2px;

opacity:0;

flex-shrink:0;
}

.equalizer span{

width:3px;

height:6px;

border-radius:4px;

background:#fff;
}

.song-item.active .equalizer{

opacity:1;
}

.song-item.active .equalizer span:nth-child(1){

animation:eq1 .7s ease-in-out infinite alternate;
}

.song-item.active .equalizer span:nth-child(2){

animation:eq2 .55s ease-in-out infinite alternate;
}

.song-item.active .equalizer span:nth-child(3){

animation:eq3 .8s ease-in-out infinite alternate;
}

@keyframes eq1{

from{
height:5px;
}

to{
height:17px;
}

}

@keyframes eq2{

from{
height:9px;
}

to{
height:21px;
}

}

@keyframes eq3{

from{
height:4px;
}

to{
height:14px;
}

}


/* =========================================================
   LOADING
   ========================================================= */

.loading{

display:flex;

align-items:center;
justify-content:center;

height:100%;

color:rgba(255,255,255,.65);

font-size:11px;
}

.loading-dot{

width:5px;
height:5px;

border-radius:50%;

background:#fff;

margin-left:7px;

animation:pulse 1s infinite;
}


/* =========================================================
   MUSIC PLAYER
   ========================================================= */

.player{

width:min(440px,94%);

height:116px;

padding:13px 15px;

border:
1px solid
rgba(255,255,255,.20);

border-radius:60px;

background:
rgba(20,20,20,.38);

backdrop-filter:
blur(28px)
saturate(130%);

-webkit-backdrop-filter:
blur(28px)
saturate(130%);

box-shadow:
0 18px 50px rgba(0,0,0,.38),
inset 0 1px 0 rgba(255,255,255,.08);

display:flex;

align-items:center;

gap:10px;

position:relative;

overflow:hidden;

flex-shrink:0;

touch-action:pan-y;
}


/* TOP SHINE */

.player::before{

content:"";

position:absolute;

top:0;
left:15%;

width:70%;
height:1px;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.45),
transparent
);

opacity:.7;
}


/* =========================================================
   COVER
   ========================================================= */

.cover-wrapper{

position:relative;

width:78px;
height:78px;

flex-shrink:0;

display:flex;

align-items:center;
justify-content:center;

border-radius:50%;

overflow:hidden;

border:
1px solid
rgba(255,255,255,.28);

box-shadow:
0 5px 20px rgba(0,0,0,.35);
}

.cover{

width:137%;
height:137%;

margin:-18.5%;

border-radius:50%;

object-fit:cover;

object-position:center;

background:#222;

animation:
spin 8s linear infinite;

animation-play-state:paused;
}

.cover.spinning{

animation-play-state:running;
}

.cover-wrapper::after{

content:"";

position:absolute;

width:15px;
height:15px;

background:
rgba(15,15,15,.9);

border:
2px solid
rgba(255,255,255,.32);

border-radius:50%;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

z-index:2;
}

@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}


/* =========================================================
   INFO
   ========================================================= */

.middle{

flex:1;

min-width:0;

display:flex;

flex-direction:column;

justify-content:center;
}

.title{

font-size:15px;

font-weight:750;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

color:#fff;
}

.artist{

font-size:10.5px;

color:rgba(255,255,255,.58);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:2px;

margin-bottom:7px;
}


/* =========================================================
   SEEK
   ========================================================= */

.seek{

position:relative;

width:100%;

height:4px;

border-radius:10px;

background:
rgba(255,255,255,.20);

cursor:pointer;

margin-bottom:5px;

touch-action:none;

user-select:none;

-webkit-user-select:none;
}

.seek::before{

content:"";

position:absolute;

top:-12px;
bottom:-12px;

left:-10px;
right:-10px;

z-index:1;
}

.fill{

position:absolute;

left:0;
top:0;

height:100%;

width:0;

background:#fff;

border-radius:10px;

pointer-events:none;

z-index:2;

box-shadow:
0 0 7px rgba(255,255,255,.45);
}

.time-display{

font-size:9px;

color:rgba(255,255,255,.55);

font-variant-numeric:tabular-nums;
}


/* =========================================================
   CONTROLS
   ========================================================= */

.controls{

display:flex;

align-items:center;

gap:5px;

flex-shrink:0;
}

.skip-btn{

width:26px;
height:30px;

border:0;

background:transparent;

color:#fff;

display:flex;

align-items:center;
justify-content:center;

cursor:pointer;

padding:0;

transition:
transform .15s ease;
}

.skip-btn svg{

width:18px;
height:18px;

fill:#fff;
}

.skip-btn:active{

transform:scale(.82);
}


/* PLAY */

.play{

width:43px;
height:43px;

border-radius:50%;

border:0;

background:#fff;

color:#000;

display:flex;

align-items:center;
justify-content:center;

box-shadow:
0 5px 18px rgba(0,0,0,.35);

cursor:pointer;

flex-shrink:0;

transition:
transform .15s ease;
}

.play svg{

width:19px;
height:19px;

fill:#000;

margin-left:2px;
}

.play.playing svg{

margin-left:0;
}

.play:active{

transform:scale(.88);
}


/* =========================================================
   VOLUME
   ========================================================= */

.vol-container{

display:flex;

align-items:center;

gap:4px;

background:
rgba(0,0,0,.22);

border:
1px solid
rgba(255,255,255,.13);

padding:3px 5px;

border-radius:20px;

backdrop-filter:blur(10px);

-webkit-backdrop-filter:blur(10px);
}

.btn{

width:27px;
height:27px;

border:0;

background:transparent;

color:#fff;

display:flex;

align-items:center;
justify-content:center;

cursor:pointer;

padding:0;
}

.btn svg{

width:18px;
height:18px;

fill:#fff;
}

.vol-slider-wrapper{

width:0;

overflow:hidden;

opacity:0;

display:flex;

align-items:center;

transition:
width .28s cubic-bezier(.2,.8,.2,1),
opacity .2s ease;
}

.vol-slider-wrapper.active{

width:52px;

opacity:1;

margin-left:2px;
}

.vol-slider{

-webkit-appearance:none;

appearance:none;

width:52px;

height:3px;

background:
rgba(255,255,255,.3);

border-radius:10px;

outline:none;

cursor:pointer;
}

.vol-slider::-webkit-slider-thumb{

-webkit-appearance:none;

appearance:none;

width:10px;
height:10px;

border-radius:50%;

background:#fff;

cursor:pointer;
}


/* IOS */

@supports (-webkit-touch-callout:none){

.vol-container{
display:none!important;
}

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:480px){

.app{

padding:
58px
10px
16px;
}

.music-library{

width:96%;

margin-bottom:11px;
}

.library-header{

padding:
0 7px
8px;
}

.library-title{

font-size:19px;
}

.library-subtitle{

font-size:9px;
}

.song-count{

font-size:9px;

padding:4px 8px;
}

.song-list{

gap:6px;

padding:
2px
2px
5px;
}

.song-item{

min-height:59px;

padding:7px 8px;

border-radius:16px;

gap:9px;
}

.song-thumb-wrap{

width:44px;
height:44px;

border-radius:11px;
}

.song-number{

width:15px;

font-size:8px;
}

.song-item-title{

font-size:11px;
}

.song-item-artist{

font-size:8.5px;
}

.player{

width:96%;

height:112px;

padding:
11px 12px;

gap:8px;

border-radius:58px;
}

.cover-wrapper{

width:74px;
height:74px;
}

.title{

font-size:14px;
}

.artist{

font-size:10px;

margin-bottom:6px;
}

.play{

width:40px;
height:40px;
}

.skip-btn{

width:24px;
}

.controls{

gap:2px;
}

}


/* =========================================================
   VERY SMALL SCREEN
   ========================================================= */

@media(max-height:650px){

.app{

padding-top:55px;
padding-bottom:10px;
}

.library-header{

padding-bottom:5px;
}

.song-item{

min-height:53px;

padding:6px 8px;
}

.song-thumb-wrap{

width:40px;
height:40px;
}

.player{

height:102px;
}

.cover-wrapper{

width:68px;
height:68px;
}

}


</style>
</head>

<body>


<!-- ======================================================
     BACKGROUND
     ====================================================== -->

<div class="bg"></div>


<!-- ======================================================
     TOP TIME
     ====================================================== -->

<div class="top-widgets">

<div class="bd-time">

<span>BD</span>

<span class="live-dot"></span>

<span id="bdTimeVal">
--:--:-- --
</span>

</div>

</div>


<!-- ======================================================
     YOUTUBE
     ====================================================== -->

<div id="yt"></div>


<!-- ======================================================
     APP
     ====================================================== -->

<div class="app">


<!-- ====================================================
     MUSIC LIBRARY
     ==================================================== -->

<section class="music-library">


<div class="library-header">

<div class="library-left">

<div class="library-title">
My Playlist
</div>

<div class="library-subtitle">
Your music collection
</div>

</div>

<div
class="song-count"
id="songCount"
>
0 Songs
</div>

</div>


<div
class="song-list"
id="songList"
>

<div class="loading">

Loading songs

<span class="loading-dot"></span>

</div>

</div>

</section>


<!-- ====================================================
     PLAYER
     ==================================================== -->

<section
class="player"
id="playerCard"
>


<!-- COVER -->

<div class="cover-wrapper">

<img
id="cover"
class="cover"
src="logo.png"
alt="Album art"
>

</div>


<!-- INFO -->

<div class="middle">

<div
id="title"
class="title"
>
My Playlist
</div>

<div
id="artist"
class="artist"
>
YouTube Music
</div>


<div
class="seek"
id="seek"
>

<div
class="fill"
id="fill"
></div>

</div>


<div class="time-display">

<span id="current">
0:00
</span>

/

<span id="duration">
0:00
</span>

</div>

</div>


<!-- CONTROLS -->

<div class="controls">


<!-- PREVIOUS -->

<button
class="skip-btn"
onclick="previousSong()"
aria-label="Previous"
>

<svg viewBox="0 0 24 24">

<path d="
M6 5h2v14H6z
M20 6.5v11L10 12z
"/>

</svg>

</button>


<!-- PLAY -->

<button
class="play"
id="play"
onclick="togglePlay()"
aria-label="Play"
>

<svg
id="play-icon"
viewBox="0 0 24 24"
>

<path d="
M8 5v14l11-7z
"/>

</svg>

</button>


<!-- NEXT -->

<button
class="skip-btn"
onclick="nextSong()"
aria-label="Next"
>

<svg viewBox="0 0 24 24">

<path d="
M16 5h2v14h-2z
M4 6.5v11l10-5.5z
"/>

</svg>

</button>


<!-- VOLUME -->

<div class="vol-container">

<button
class="btn"
onclick="toggleVolume()"
aria-label="Volume"
>

<svg viewBox="0 0 24 24">

<path d="
M3 9v6h4l5 5V4L7 9H3
zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05
c1.48-.73 2.5-2.25 2.5-4.02z
M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71
v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z
"/>

</svg>

</button>


<div
class="vol-slider-wrapper"
id="volWrapper"
>

<input
type="range"
class="vol-slider"
id="volSlider"
min="0"
max="100"
value="100"
oninput="changeVolume(this.value)"
>

</div>

</div>

</div>

</section>

</div>


<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =========================================================
   PLAYLIST
   ========================================================= */

const PLAYLIST_ID="PLB9TgDHfMHmM";

let player=null;

let playing=false;

let playlistItems=[];


/* =========================================================
   BD TIME
   ========================================================= */

function updateBDTime(){

const options={

timeZone:"Asia/Dhaka",

hour:"2-digit",

minute:"2-digit",

second:"2-digit",

hour12:true

};

document.getElementById("bdTimeVal").textContent=

new Intl.DateTimeFormat(
"en-US",
options
).format(new Date());

}

updateBDTime();

setInterval(
updateBDTime,
1000
);


/* =========================================================
   YOUTUBE API
   ========================================================= */

function onYouTubeIframeAPIReady(){

player=new YT.Player(
"yt",
{

width:"2",
height:"2",

playerVars:{

autoplay:0,

controls:0,

disablekb:1,

fs:0,

modestbranding:1,

playsinline:1,

rel:0,

listType:"playlist",

list:PLAYLIST_ID

},

events:{

onReady:ready,

onStateChange:state

}

});

}


/* =========================================================
   READY
   ========================================================= */

function ready(){

loadPlaylistItems();

setInterval(
updateProgress,
250
);

}


/* =========================================================
   STATE
   ========================================================= */

function state(e){

const cover=
document.getElementById("cover");

const playBtn=
document.getElementById("play");

const playIcon=
document.getElementById("play-icon");


highlightActiveTrack();


if(
e.data===YT.PlayerState.PLAYING
){

playing=true;

playBtn.classList.add("playing");

playIcon.innerHTML=
`
<path d="
M6 19h4V5H6v14zm8-14v14h4V5h-4z
"/>
`;

cover.classList.add("spinning");

updateInfo();

highlightActiveTrack();

}


else if(

e.data===YT.PlayerState.PAUSED ||

e.data===YT.PlayerState.ENDED

){

playing=false;

playBtn.classList.remove("playing");

playIcon.innerHTML=
`
<path d="
M8 5v14l11-7z
"/>
`;

cover.classList.remove("spinning");

}

}


/* =========================================================
   PLAY / PAUSE
   ========================================================= */

function togglePlay(){

if(!player)
return;

if(playing){

player.pauseVideo();

}

else{

player.playVideo();

}

}


/* =========================================================
   VOLUME
   ========================================================= */

let volTimer=null;

function resetVolTimer(){

if(volTimer)
clearTimeout(volTimer);

volTimer=setTimeout(()=>{

document
.getElementById("volWrapper")
.classList.remove("active");

},3000);

}


function toggleVolume(){

const wrapper=
document.getElementById("volWrapper");

if(
wrapper.classList.contains("active")
){

wrapper.classList.remove("active");

if(volTimer)
clearTimeout(volTimer);

}

else{

wrapper.classList.add("active");

resetVolTimer();

}

}


function changeVolume(val){

if(
player &&
typeof player.setVolume==="function"
){

player.setVolume(val);

}

resetVolTimer();

}


/* =========================================================
   NEXT
   ========================================================= */

function nextSong(){

if(
!player ||
playlistItems.length===0
)
return;

const current=
player.getPlaylistIndex();

const next=
(current+1)%
playlistItems.length;

forceUpdateUI(next);

player.playVideoAt(next);

}


/* =========================================================
   PREVIOUS
   ========================================================= */

function previousSong(){

if(
!player ||
playlistItems.length===0
)
return;

const current=
player.getPlaylistIndex();

const previous=
(current-1+
playlistItems.length)%
playlistItems.length;

forceUpdateUI(previous);

player.playVideoAt(previous);

}


/* =========================================================
   FORCE UI
   ========================================================= */

function forceUpdateUI(index){

if(
!playlistItems[index]
)
return;

const id=
playlistItems[index];

document.getElementById("cover").src=

`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;

const title=
document.getElementById(
`title-${index}`
);

const artist=
document.getElementById(
`artist-${index}`
);

if(title){

document.getElementById("title")
.textContent=
title.textContent;

}

if(artist){

document.getElementById("artist")
.textContent=
artist.textContent;

}

highlightActiveTrack();

}


/* =========================================================
   SWIPE
   ========================================================= */

let swipeStartX=0;

let swipeStartY=0;

let swipeActive=false;

let swipeFromSeek=false;

const playerCard=
document.getElementById("playerCard");

const seekElement=
document.getElementById("seek");


playerCard.addEventListener(
"pointerdown",
e=>{

swipeStartX=e.clientX;

swipeStartY=e.clientY;

swipeFromSeek=
!!e.target.closest("#seek");

swipeActive=true;

if(swipeFromSeek){

e.stopPropagation();

}

});


playerCard.addEventListener(
"pointermove",
e=>{

if(!swipeActive)
return;

if(swipeFromSeek){

e.stopPropagation();

}

});


playerCard.addEventListener(
"pointerup",
e=>{

if(!swipeActive)
return;

const dx=
e.clientX-swipeStartX;

const dy=
e.clientY-swipeStartY;

if(swipeFromSeek){

swipeActive=false;

return;

}

if(
Math.abs(dx)<50
){

swipeActive=false;

return;

}

if(
Math.abs(dy)>
Math.abs(dx)
){

swipeActive=false;

return;

}

if(dx<-50){

nextSong();

}

else if(dx>50){

previousSong();

}

swipeActive=false;

});


playerCard.addEventListener(
"pointercancel",
()=>{

swipeActive=false;

}
);


/* =========================================================
   SEEK
   ========================================================= */

let isDragging=false;

let seekPointerId=null;


function getSeekPosition(clientX){

const rect=
seekElement.getBoundingClientRect();

if(!rect.width)
return 0;

return Math.max(
0,
Math.min(
1,
(clientX-rect.left)/
rect.width
)
);

}


function updateSeekVisual(pos){

document.getElementById("fill")
.style.width=
(pos*100)+"%";

if(
player &&
typeof player.getDuration==="function"
){

const duration=
player.getDuration();

if(duration){

document.getElementById("current")
.textContent=
format(pos*duration);

document.getElementById("duration")
.textContent=
format(duration);

}

}

}


/* SEEK START */

seekElement.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

e.stopPropagation();

isDragging=true;

seekPointerId=e.pointerId;

try{

seekElement.setPointerCapture(
e.pointerId
);

}catch(err){}

const pos=
getSeekPosition(e.clientX);

updateSeekVisual(pos);

},
{
passive:false
}
);


/* SEEK MOVE */

seekElement.addEventListener(
"pointermove",
e=>{

if(!isDragging)
return;

e.preventDefault();

e.stopPropagation();

const pos=
getSeekPosition(e.clientX);

updateSeekVisual(pos);

},
{
passive:false
}
);


/* SEEK END */

seekElement.addEventListener(
"pointerup",
e=>{

if(!isDragging)
return;

e.preventDefault();

e.stopPropagation();

const pos=
getSeekPosition(e.clientX);

updateSeekVisual(pos);

if(
player &&
typeof player.getDuration==="function"
){

const duration=
player.getDuration();

if(duration){

player.seekTo(
pos*duration,
true
);

}

}

isDragging=false;

seekPointerId=null;

try{

seekElement.releasePointerCapture(
e.pointerId
);

}catch(err){}

},
{
passive:false
}
);


/* =========================================================
   PROGRESS
   ========================================================= */

function updateProgress(){

if(isDragging)
return;

if(
!player ||
typeof player.getCurrentTime!=="function"
)
return;

try{

const current=
player.getCurrentTime();

const duration=
player.getDuration();

if(!duration)
return;

const pos=
Math.max(
0,
Math.min(
1,
current/duration
)
);

document.getElementById("fill")
.style.width=
(pos*100)+"%";

document.getElementById("current")
.textContent=
format(current);

document.getElementById("duration")
.textContent=
format(duration);

}catch(e){}

}


/* =========================================================
   FORMAT
   ========================================================= */

function format(s){

if(
!s ||
isNaN(s)
)
return "0:00";

s=Math.floor(s);

return Math.floor(s/60)
+
":"
+
String(
s%60
).padStart(2,"0");

}


/* =========================================================
   LOAD PLAYLIST
   ========================================================= */

function loadPlaylistItems(){

if(
!player ||
typeof player.getPlaylist!=="function"
)
return;

playlistItems=
player.getPlaylist();

const list=
document.getElementById("songList");

const count=
document.getElementById("songCount");


if(
!playlistItems ||
playlistItems.length===0
){

list.innerHTML=
`
<div class="loading">
No tracks found
</div>
`;

count.textContent="0 Songs";

return;

}


count.textContent=
playlistItems.length+
(
playlistItems.length===1
?
" Song"
:
" Songs"
);


list.innerHTML="";


playlistItems.forEach(
(id,index)=>{

const item=
document.createElement("div");

item.className=
"song-item";

item.id=
`track-${index}`;

item.style.animationDelay=
(index*0.035)+"s";


item.onclick=()=>{

playSpecificTrack(index);

};


item.innerHTML=
`

<div class="song-number">
${String(index+1).padStart(2,"0")}
</div>


<div class="song-thumb-wrap">

<img
src="https://i.ytimg.com/vi/${id}/hqdefault.jpg"
alt="Song"
loading="lazy"
>

<div class="thumb-play">

<svg viewBox="0 0 24 24">

<path d="
M8 5v14l11-7z
"/>

</svg>

</div>

</div>


<div class="song-item-info">

<div
class="song-item-title"
id="title-${index}"
>
Track #${index+1}
</div>

<div
class="song-item-artist"
id="artist-${index}"
>
YouTube Music
</div>

</div>


<div class="equalizer">

<span></span>
<span></span>
<span></span>

</div>

`;


list.appendChild(item);


fetchSongDetails(
id,
index
);

});


highlightActiveTrack();

updateInfo();

}


/* =========================================================
   FETCH SONG DETAILS
   ========================================================= */

function fetchSongDetails(
id,
index
){

fetch(
`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
)

.then(
r=>r.json()
)

.then(
data=>{

if(!data)
return;

const title=
document.getElementById(
`title-${index}`
);

const artist=
document.getElementById(
`artist-${index}`
);

if(
title &&
data.title
){

title.textContent=
data.title;

}

if(
artist &&
data.author_name
){

artist.textContent=
data.author_name;

}

})

.catch(
()=>{}
);

}


/* =========================================================
   PLAY SPECIFIC
   ========================================================= */

function playSpecificTrack(index){

if(
!player ||
!playlistItems[index]
)
return;


forceUpdateUI(index);

player.playVideoAt(index);


/* Scroll selected song into view */

setTimeout(()=>{

const selected=
document.getElementById(
`track-${index}`
);

if(selected){

selected.scrollIntoView({

behavior:"smooth",

block:"nearest"

});

}

},120);

}


/* =========================================================
   ACTIVE SONG
   ========================================================= */

function highlightActiveTrack(){

if(
!player ||
typeof player.getPlaylistIndex!=="function"
)
return;

const current=
player.getPlaylistIndex();

document
.querySelectorAll(".song-item")
.forEach(
(item,index)=>{

item.classList.toggle(
"active",
index===current
);

});

}


/* =========================================================
   SONG INFO
   ========================================================= */

function updateInfo(){

if(
!player ||
typeof player.getVideoData!=="function"
)
return;

try{

const d=
player.getVideoData();

if(
!d ||
!d.video_id
)
return;


document.getElementById("cover").src=

`https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`;


if(d.title){

document.getElementById("title")
.textContent=d.title;

}


if(d.author){

document.getElementById("artist")
.textContent=d.author;

}

highlightActiveTrack();

}catch(e){}

}

</script>

</body>
</html>
