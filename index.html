<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>My Music Player</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">

<link rel="apple-touch-icon"
sizes="180x180"
href="logo.png">

<link rel="icon"
type="image/png"
href="logo.png">

<style>

/* =====================================================
   RESET
===================================================== */

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{

margin:0;
padding:0;

width:100%;
height:100%;

overflow:hidden;

background:#050505;

color:#fff;

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"Segoe UI",
sans-serif;
}

body{
position:relative;
}


/* =====================================================
   BACKGROUND
===================================================== */

.bg{

position:fixed;

inset:0;

background:
url("background.jpg")
center center /
cover
no-repeat;

z-index:0;
}

.bg::after{

content:"";

position:absolute;

inset:0;

background:
rgba(0,0,0,.18);
}


/* =====================================================
   TOP TIME
===================================================== */

.top-widgets{

position:fixed;

top:12px;

left:50%;

transform:
translateX(-50%);

z-index:100;

display:flex;

align-items:center;
}


.bd-time{

display:flex;

align-items:center;

gap:6px;

padding:
5px 11px;

border-radius:20px;

background:
rgba(0,0,0,.4);

border:
1px solid
rgba(255,255,255,.16);

backdrop-filter:
blur(14px);

-webkit-backdrop-filter:
blur(14px);

font-size:10px;

font-weight:600;

letter-spacing:.3px;

color:
rgba(255,255,255,.9);
}


.live-dot{

width:6px;
height:6px;

border-radius:50%;

background:#ff3b30;

box-shadow:
0 0 8px #ff3b30;

animation:
pulse 1.5s infinite;
}


@keyframes pulse{

0%{
opacity:1;
transform:scale(1);
}

50%{
opacity:.35;
transform:scale(.8);
}

100%{
opacity:1;
transform:scale(1);
}

}


/* =====================================================
   YOUTUBE
===================================================== */

#yt{

position:fixed;

width:2px;
height:2px;

left:-10px;
bottom:-10px;

opacity:.01;

pointer-events:none;
}


/* =====================================================
   MAIN PLAYER
===================================================== */

.app{

position:relative;

z-index:2;

width:100%;
height:100dvh;

display:flex;

align-items:center;

justify-content:flex-end;

flex-direction:column;

padding-bottom:18px;
}


/* =====================================================
   PLAYER
===================================================== */

.player{

width:min(440px,94%);

height:120px;

padding:
14px 18px;

border:
1px solid
rgba(255,255,255,.18);

border-radius:60px;

background:
rgba(20,20,20,.35);

backdrop-filter:
blur(25px);

-webkit-backdrop-filter:
blur(25px);

box-shadow:
0 20px 50px
rgba(0,0,0,.35);

display:flex;

align-items:center;

gap:12px;

position:relative;

overflow:hidden;

flex-shrink:0;

touch-action:pan-y;

transition:
transform .35s ease,
opacity .35s ease;
}


/* =====================================================
   COVER
===================================================== */

.cover-wrapper{

position:relative;

width:84px;
height:84px;

flex-shrink:0;

display:flex;

align-items:center;
justify-content:center;

border-radius:50%;

overflow:hidden;

border:
1px solid
rgba(255,255,255,.3);
}


.cover{

width:137%;
height:137%;

margin:-18.5%;

border-radius:50%;

object-fit:cover;

background:#222;

animation:
spin 8s linear infinite;

animation-play-state:paused;
}


.cover.spinning{

animation-play-state:running;
}


.cover-wrapper::after{

content:"";

position:absolute;

width:16px;
height:16px;

border-radius:50%;

background:
rgba(20,20,20,.88);

border:
2px solid
rgba(255,255,255,.3);

left:50%;
top:50%;

transform:
translate(-50%,-50%);
}


@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}


/* =====================================================
   PLAYER INFO
===================================================== */

.middle{

flex:1;

min-width:0;

display:flex;

flex-direction:column;

justify-content:center;
}


.title{

font-size:16px;

font-weight:700;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

color:#fff;
}


.artist{

font-size:12px;

color:
rgba(255,255,255,.65);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:2px;

margin-bottom:8px;
}


/* =====================================================
   SEEK
===================================================== */

.seek{

position:relative;

width:100%;

height:5px;

border-radius:10px;

background:
rgba(255,255,255,.2);

cursor:pointer;

margin-bottom:6px;

touch-action:none;
}


.fill{

position:absolute;

left:0;
top:0;

height:100%;

width:0;

border-radius:10px;

background:#fff;

pointer-events:none;
}


.time-display{

font-size:11px;

color:
rgba(255,255,255,.65);

font-variant-numeric:tabular-nums;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{

display:flex;

align-items:center;

gap:7px;

flex-shrink:0;
}


.btn,
.skip-btn{

width:28px;
height:28px;

border:0;

background:transparent;

color:#fff;

display:flex;

align-items:center;

justify-content:center;

padding:0;

cursor:pointer;
}


.btn svg,
.skip-btn svg{

width:19px;
height:19px;

fill:#fff;
}


.play{

width:44px;
height:44px;

border-radius:50%;

border:0;

background:#fff;

color:#000;

display:flex;

align-items:center;
justify-content:center;

cursor:pointer;

box-shadow:
0 4px 15px
rgba(0,0,0,.3);

flex-shrink:0;
}


.play svg{

width:20px;
height:20px;

fill:#000;
}


.play:active,
.skip-btn:active{

transform:scale(.9);
}


/* =====================================================
   VOLUME
===================================================== */

.vol-container{

display:flex;

align-items:center;

gap:3px;

background:
rgba(0,0,0,.25);

border:
1px solid
rgba(255,255,255,.12);

padding:
4px 6px;

border-radius:20px;
}


.vol-slider-wrapper{

width:0;

overflow:hidden;

opacity:0;

transition:
width .25s ease,
opacity .2s ease;
}


.vol-slider-wrapper.active{

width:55px;

opacity:1;
}


.vol-slider{

appearance:none;

-webkit-appearance:none;

width:55px;

height:3px;

background:
rgba(255,255,255,.3);

border-radius:10px;

outline:none;
}


.vol-slider::-webkit-slider-thumb{

appearance:none;

-webkit-appearance:none;

width:10px;
height:10px;

border-radius:50%;

background:#fff;
}


/* =====================================================
   PLAYLIST BUTTON
===================================================== */

.playlist-toggle-btn{

position:fixed;

right:14px;

bottom:154px;

z-index:1200;

height:30px;

padding:
0 10px;

display:flex;

align-items:center;

gap:5px;

border-radius:16px;

border:
1px solid
rgba(255,255,255,.16);

background:
rgba(15,15,15,.5);

color:#fff;

backdrop-filter:
blur(16px);

-webkit-backdrop-filter:
blur(16px);

font-size:10px;

font-weight:600;

cursor:pointer;

transition:
transform .2s ease,
background .2s ease;
}


.playlist-toggle-btn:active{

transform:scale(.92);
}


.playlist-toggle-btn svg{

width:14px;
height:14px;

fill:none;

stroke:#fff;

stroke-width:1.8;

stroke-linecap:round;

stroke-linejoin:round;
}


/* =====================================================
   DARK OVERLAY
===================================================== */

.playlist-overlay{

position:fixed;

inset:0;

background:
rgba(0,0,0,.22);

z-index:1090;

opacity:0;

visibility:hidden;

transition:
opacity .3s ease,
visibility .3s ease;

backdrop-filter:
blur(1px);

-webkit-backdrop-filter:
blur(1px);
}


.playlist-overlay.open{

opacity:1;

visibility:visible;
}


/* =====================================================
   RIGHT PLAYLIST DRAWER
===================================================== */

.playlist-drawer{

position:fixed;

z-index:1100;

top:0;

right:0;

width:min(48vw,360px);

height:100dvh;

background:
rgba(12,12,12,.78);

border-left:
1px solid
rgba(255,255,255,.13);

backdrop-filter:
blur(28px)
saturate(130%);

-webkit-backdrop-filter:
blur(28px)
saturate(130%);

transform:
translateX(105%);

transition:
transform .38s
cubic-bezier(.22,.8,.25,1);

display:flex;

flex-direction:column;

padding:
22px 10px 15px;
}


.playlist-drawer.open{

transform:
translateX(0);
}


/* =====================================================
   DRAWER HEADER
===================================================== */

.playlist-head{

height:34px;

display:flex;

align-items:center;

justify-content:space-between;

padding:
0 6px;

flex-shrink:0;
}


.playlist-title{

font-size:13px;

font-weight:700;

letter-spacing:.2px;
}


.playlist-count{

font-size:9px;

color:
rgba(255,255,255,.45);
}


/* =====================================================
   SONG LIST
===================================================== */

.song-list{

flex:1;

min-height:0;

overflow-y:auto;

padding:
5px 1px 10px;

-webkit-overflow-scrolling:touch;

overscroll-behavior:contain;
}


.song-list::-webkit-scrollbar{

width:2px;
}


.song-list::-webkit-scrollbar-thumb{

background:
rgba(255,255,255,.22);

border-radius:10px;
}


/* =====================================================
   SONG ITEM
===================================================== */

.song-item{

position:relative;

height:54px;

display:flex;

align-items:center;

gap:8px;

padding:
5px 6px;

margin-bottom:3px;

border-radius:11px;

background:
rgba(255,255,255,.025);

border:
1px solid
transparent;

cursor:pointer;

transition:
background .2s ease,
border .2s ease,
transform .15s ease;
}


.song-item:active{

transform:scale(.98);

background:
rgba(255,255,255,.08);
}


.song-item.active{

background:
rgba(255,255,255,.09);

border-color:
rgba(255,255,255,.14);
}


.song-item.active::before{

content:"";

position:absolute;

left:0;

top:14px;

bottom:14px;

width:2px;

border-radius:5px;

background:#fff;

box-shadow:
0 0 7px
rgba(255,255,255,.65);
}


/* =====================================================
   NUMBER
===================================================== */

.song-number{

width:15px;

font-size:8px;

text-align:center;

color:
rgba(255,255,255,.38);

flex-shrink:0;
}


.song-item.active .song-number{

color:#fff;
}


/* =====================================================
   THUMBNAIL
===================================================== */

.song-thumb{

width:40px;
height:40px;

border-radius:8px;

overflow:hidden;

background:#222;

flex-shrink:0;
}


.song-thumb img{

width:100%;
height:100%;

display:block;

object-fit:cover;
}


/* =====================================================
   SONG INFO
===================================================== */

.song-info{

flex:1;

min-width:0;
}


.song-title{

font-size:10px;

font-weight:650;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

color:#fff;
}


.song-artist{

font-size:8px;

color:
rgba(255,255,255,.48);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:3px;
}


/* =====================================================
   EQUALIZER
===================================================== */

.equalizer{

width:16px;

height:15px;

display:flex;

align-items:flex-end;

justify-content:flex-end;

gap:2px;

opacity:0;

flex-shrink:0;
}


.equalizer span{

width:2px;

height:5px;

border-radius:3px;

background:#fff;
}


.song-item.active .equalizer{

opacity:1;
}


.song-item.active
.equalizer span:nth-child(1){

animation:
eq1 .7s infinite alternate;
}


.song-item.active
.equalizer span:nth-child(2){

animation:
eq2 .5s infinite alternate;
}


.song-item.active
.equalizer span:nth-child(3){

animation:
eq3 .8s infinite alternate;
}


@keyframes eq1{

from{height:4px}
to{height:12px}

}


@keyframes eq2{

from{height:6px}
to{height:15px}

}


@keyframes eq3{

from{height:3px}
to{height:10px}

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

.playlist-drawer{

width:52vw;

min-width:190px;

max-width:260px;

padding:
20px 8px 12px;
}


.playlist-toggle-btn{

right:10px;

bottom:140px;
}


.song-item{

height:51px;

padding:
5px;

gap:7px;
}


.song-thumb{

width:36px;
height:36px;

border-radius:7px;
}


.song-title{

font-size:9.5px;
}


.song-artist{

font-size:7.5px;
}


.player{

width:96%;

height:116px;

padding:
12px 14px;

border-radius:58px;

gap:9px;
}


.cover-wrapper{

width:76px;
height:76px;
}


.title{

font-size:15px;
}


.artist{

font-size:11px;
}


.play{

width:42px;
height:42px;
}

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media(max-width:380px){

.playlist-drawer{

width:57vw;

min-width:185px;
}


.player{

height:110px;

padding:
10px 12px;
}


.cover-wrapper{

width:70px;
height:70px;
}


.controls{

gap:4px;
}


.play{

width:40px;
height:40px;
}


.playlist-toggle-btn{

bottom:134px;
}

}


/* =====================================================
   IOS
===================================================== */

@supports (-webkit-touch-callout:none){

.vol-container{

display:none!important;
}

}

</style>

</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="bg"></div>


<!-- =====================================================
     TIME
===================================================== -->

<div class="top-widgets">

<div class="bd-time">

<span>BD</span>

<span class="live-dot"></span>

<span id="bdTimeVal">
--:--:-- --
</span>

</div>

</div>


<!-- =====================================================
     YOUTUBE PLAYER
===================================================== -->

<div id="yt"></div>


<!-- =====================================================
     PLAYLIST BUTTON
===================================================== -->

<button
class="playlist-toggle-btn"
id="playlistToggle"
onclick="togglePlaylist()"
>

<svg viewBox="0 0 24 24">

<path d="
M4 6h16
M4 12h16
M4 18h10
"/>

</svg>

<span>Playlist</span>

</button>


<!-- =====================================================
     OVERLAY
===================================================== -->

<div
class="playlist-overlay"
id="playlistOverlay"
onclick="closePlaylist()"
></div>


<!-- =====================================================
     RIGHT DRAWER
===================================================== -->

<aside
class="playlist-drawer"
id="playlistDrawer"
>


<div class="playlist-head">

<div class="playlist-title">
Playlist
</div>

<div
class="playlist-count"
id="songCount"
>
0 Songs
</div>

</div>


<div
class="song-list"
id="songList"
>

<div style="
text-align:center;
padding-top:25px;
font-size:10px;
color:rgba(255,255,255,.45);
">
Loading...
</div>

</div>


</aside>


<!-- =====================================================
     APP
===================================================== -->

<div class="app">


<section
class="player"
id="playerCard"
>


<!-- COVER -->

<div class="cover-wrapper">

<img
id="cover"
class="cover"
src="logo.png"
alt=""
>

</div>


<!-- INFO -->

<div class="middle">

<div
class="title"
id="title"
>
My Playlist
</div>


<div
class="artist"
id="artist"
>
YouTube Music
</div>


<div
class="seek"
id="seek"
>

<div
class="fill"
id="fill"
></div>

</div>


<div class="time-display">

<span id="current">
0:00
</span>

/

<span id="duration">
0:00
</span>

</div>

</div>


<!-- CONTROLS -->

<div class="controls">


<button
class="skip-btn"
onclick="previousSong()"
>

<svg viewBox="0 0 24 24">

<path d="
M6 5h2v14H6z
M20 6.5v11L10 12z
"/>

</svg>

</button>


<button
class="play"
id="play"
onclick="togglePlay()"
>

<svg
id="play-icon"
viewBox="0 0 24 24"
>

<path d="
M8 5v14l11-7z
"/>

</svg>

</button>


<button
class="skip-btn"
onclick="nextSong()"
>

<svg viewBox="0 0 24 24">

<path d="
M16 5h2v14h-2z
M4 6.5v11l10-5.5z
"/>

</svg>

</button>


<div class="vol-container">

<button
class="btn"
onclick="toggleVolume()"
>

<svg viewBox="0 0 24 24">

<path d="
M3 9v6h4l5 5V4L7 9H3
zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05
c1.48-.73 2.5-2.25 2.5-4.02z
M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71
v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z
"/>

</svg>

</button>


<div
class="vol-slider-wrapper"
id="volWrapper"
>

<input
class="vol-slider"
id="volSlider"
type="range"
min="0"
max="100"
value="100"
oninput="changeVolume(this.value)"
>

</div>

</div>

</div>

</section>

</div>


<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const PLAYLIST_ID =
"PLB9TgDHfMHmM";


let player = null;

let playing = false;

let playlistItems = [];


/* =====================================================
   TIME
===================================================== */

function updateBDTime(){

const options = {

timeZone:"Asia/Dhaka",

hour:"2-digit",

minute:"2-digit",

second:"2-digit",

hour12:true

};

document
.getElementById("bdTimeVal")
.textContent =
new Intl.DateTimeFormat(
"en-US",
options
).format(new Date());

}

updateBDTime();

setInterval(
updateBDTime,
1000
);


/* =====================================================
   YOUTUBE READY
===================================================== */

function onYouTubeIframeAPIReady(){

player =
new YT.Player(
"yt",
{

width:"2",

height:"2",

playerVars:{

autoplay:0,

controls:0,

disablekb:1,

fs:0,

playsinline:1,

rel:0,

modestbranding:1,

listType:"playlist",

list:PLAYLIST_ID

},

events:{

onReady:onReady,

onStateChange:onStateChange

}

});

}


/* =====================================================
   READY
===================================================== */

function onReady(){

loadPlaylistItems();

setInterval(
updateProgress,
250
);

}


/* =====================================================
   STATE
===================================================== */

function onStateChange(event){

if(
event.data ===
YT.PlayerState.PLAYING
){

playing=true;

setPlayingUI(true);

updateInfo();

}

else if(

event.data ===
YT.PlayerState.PAUSED ||

event.data ===
YT.PlayerState.ENDED

){

playing=false;

setPlayingUI(false);

}

highlightActiveTrack();

}


/* =====================================================
   PLAY UI
===================================================== */

function setPlayingUI(isPlaying){

const icon =
document.getElementById("play-icon");

const cover =
document.getElementById("cover");


if(isPlaying){

icon.innerHTML = `
<path d="
M6 19h4V5H6v14zm8-14v14h4V5h-4z
"/>
`;

cover.classList.add("spinning");

}

else{

icon.innerHTML = `
<path d="
M8 5v14l11-7z
"/>
`;

cover.classList.remove("spinning");

}

}


/* =====================================================
   PLAY PAUSE
===================================================== */

function togglePlay(){

if(!player)
return;


if(playing){

player.pauseVideo();

}
else{

player.playVideo();

}

}


/* =====================================================
   NEXT
===================================================== */

function nextSong(){

if(
!player ||
!playlistItems.length
)
return;


let current =
player.getPlaylistIndex();


let next =
(current + 1) %
playlistItems.length;


player.playVideoAt(next);

forceUpdateUI(next);

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousSong(){

if(
!player ||
!playlistItems.length
)
return;


let current =
player.getPlaylistIndex();


let previous =
(current - 1 +
playlistItems.length) %
playlistItems.length;


player.playVideoAt(previous);

forceUpdateUI(previous);

}


/* =====================================================
   UPDATE UI
===================================================== */

function forceUpdateUI(index){

if(
!playlistItems[index]
)
return;


const id =
playlistItems[index];


document
.getElementById("cover")
.src =
`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;


const title =
document.getElementById(
`title-${index}`
);


const artist =
document.getElementById(
`artist-${index}`
);


if(title){

document
.getElementById("title")
.textContent =
title.textContent;

}


if(artist){

document
.getElementById("artist")
.textContent =
artist.textContent;

}


highlightActiveTrack();

scrollToActive(index);

}


/* =====================================================
   VOLUME
===================================================== */

let volumeTimer = null;


function toggleVolume(){

const wrapper =
document.getElementById(
"volWrapper"
);


if(
wrapper.classList.contains("active")
){

wrapper.classList.remove("active");

if(volumeTimer)
clearTimeout(volumeTimer);

}

else{

wrapper.classList.add("active");

volumeTimer =
setTimeout(
()=>{
wrapper.classList.remove("active");
},
3000
);

}

}


function changeVolume(value){

if(
player &&
player.setVolume
){

player.setVolume(value);

}

}


/* =====================================================
   SEEK
===================================================== */

const seek =
document.getElementById("seek");

let dragging = false;


function seekPosition(x){

const rect =
seek.getBoundingClientRect();


return Math.max(
0,
Math.min(
1,
(x - rect.left) /
rect.width
)
);

}


seek.addEventListener(
"pointerdown",
e=>{

dragging=true;

seek.setPointerCapture(
e.pointerId
);

const pos =
seekPosition(e.clientX);

document
.getElementById("fill")
.style.width =
(pos*100)+"%";

}
);


seek.addEventListener(
"pointermove",
e=>{

if(!dragging)
return;


const pos =
seekPosition(e.clientX);

document
.getElementById("fill")
.style.width =
(pos*100)+"%";

}
);


seek.addEventListener(
"pointerup",
e=>{

if(!dragging)
return;


dragging=false;


const pos =
seekPosition(e.clientX);


if(
player &&
player.getDuration
){

player.seekTo(
pos *
player.getDuration(),
true
);

}

}
);


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

if(
dragging ||
!player ||
!player.getDuration
)
return;


const duration =
player.getDuration();


if(!duration)
return;


const current =
player.getCurrentTime();


const percent =
(current/duration)*100;


document
.getElementById("fill")
.style.width =
percent+"%";


document
.getElementById("current")
.textContent =
formatTime(current);


document
.getElementById("duration")
.textContent =
formatTime(duration);

}


/* =====================================================
   TIME FORMAT
===================================================== */

function formatTime(seconds){

if(
!seconds ||
isNaN(seconds)
)
return "0:00";


seconds =
Math.floor(seconds);


return (
Math.floor(seconds/60)
+
":"+
String(
seconds%60
).padStart(2,"0")
);

}


/* =====================================================
   LOAD PLAYLIST
===================================================== */

function loadPlaylistItems(){

if(
!player ||
!player.getPlaylist
)
return;


playlistItems =
player.getPlaylist();


const list =
document.getElementById(
"songList"
);


const count =
document.getElementById(
"songCount"
);


if(
!playlistItems ||
!playlistItems.length
){

list.innerHTML = `
<div style="
text-align:center;
padding:25px 10px;
font-size:10px;
color:rgba(255,255,255,.45);
">
No songs found
</div>
`;

return;

}


count.textContent =
playlistItems.length +
(
playlistItems.length === 1
?
" Song"
:
" Songs"
);


list.innerHTML = "";


playlistItems.forEach(
(id,index)=>{

const item =
document.createElement(
"div"
);


item.className =
"song-item";


item.id =
`track-${index}`;


item.onclick =
()=>{
playSpecificTrack(index);
};


item.innerHTML = `

<div class="song-number">
${index+1}
</div>


<div class="song-thumb">

<img
src="https://i.ytimg.com/vi/${id}/hqdefault.jpg"
loading="lazy"
>

</div>


<div class="song-info">

<div
class="song-title"
id="title-${index}"
>
Track ${index+1}
</div>

<div
class="song-artist"
id="artist-${index}"
>
YouTube Music
</div>

</div>


<div class="equalizer">

<span></span>
<span></span>
<span></span>

</div>

`;


list.appendChild(item);


fetchSongDetails(
id,
index
);

});


highlightActiveTrack();

updateInfo();

}


/* =====================================================
   FETCH DETAILS
===================================================== */

function fetchSongDetails(
id,
index
){

fetch(
`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
)

.then(
response =>
response.json()
)

.then(
data=>{

const title =
document.getElementById(
`title-${index}`
);


const artist =
document.getElementById(
`artist-${index}`
);


if(
title &&
data.title
){

title.textContent =
data.title;

}


if(
artist &&
data.author_name
){

artist.textContent =
data.author_name;

}

})

.catch(
()=>{}
);

}


/* =====================================================
   PLAY SPECIFIC
===================================================== */

function playSpecificTrack(index){

if(
!player ||
!playlistItems[index]
)
return;


player.playVideoAt(index);

forceUpdateUI(index);

}


/* =====================================================
   ACTIVE SONG
===================================================== */

function highlightActiveTrack(){

if(
!player ||
!player.getPlaylistIndex
)
return;


const current =
player.getPlaylistIndex();


document
.querySelectorAll(".song-item")
.forEach(
(item,index)=>{

item.classList.toggle(
"active",
index === current
);

});

}


/* =====================================================
   SCROLL ACTIVE
===================================================== */

function scrollToActive(index){

const item =
document.getElementById(
`track-${index}`
);


if(
!item
)
return;


item.scrollIntoView({

behavior:"smooth",

block:"nearest"

});

}


/* =====================================================
   UPDATE PLAYER INFO
===================================================== */

function updateInfo(){

if(
!player ||
!player.getVideoData
)
return;


const data =
player.getVideoData();


if(
!data ||
!data.video_id
)
return;


document
.getElementById("cover")
.src =
`https://i.ytimg.com/vi/${data.video_id}/hqdefault.jpg`;


if(data.title){

document
.getElementById("title")
.textContent =
data.title;

}


if(data.author){

document
.getElementById("artist")
.textContent =
data.author;

}

}


/* =====================================================
   PLAYLIST OPEN / CLOSE
===================================================== */

const drawer =
document.getElementById(
"playlistDrawer"
);

const overlay =
document.getElementById(
"playlistOverlay"
);


function togglePlaylist(){

if(
drawer.classList.contains("open")
){

closePlaylist();

}

else{

openPlaylist();

}

}


function openPlaylist(){

drawer.classList.add("open");

overlay.classList.add("open");

}


function closePlaylist(){

drawer.classList.remove("open");

overlay.classList.remove("open");

}


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
"keydown",
e=>{

if(e.key === "Escape"){

closePlaylist();

}

});


/* =====================================================
   SWIPE PLAYER
===================================================== */

let startX=0;

let startY=0;

let swiping=false;


const playerCard =
document.getElementById(
"playerCard"
);


playerCard.addEventListener(
"pointerdown",
e=>{

if(
e.target.closest("#seek")
)
return;


startX=e.clientX;

startY=e.clientY;

swiping=true;

});


playerCard.addEventListener(
"pointerup",
e=>{

if(!swiping)
return;


const dx =
e.clientX-startX;

const dy =
e.clientY-startY;


swiping=false;


if(
Math.abs(dx)<50 ||
Math.abs(dy)>Math.abs(dx)
)
return;


if(dx<0){

nextSong();

}
else{

previousSong();

}

});


playerCard.addEventListener(
"pointercancel",
()=>{

swiping=false;

});

</script>
