<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Music Player</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Segoe UI",sans-serif;
}

body{position:relative}

/* BACKGROUND */
.bg-video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  z-index:0;
  background:#000;
  pointer-events:none;
  display:block;
}

.bg-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.12);
  z-index:1;
  pointer-events:none;
}

/* YOUTUBE */
#yt{
  position:fixed;
  width:2px;
  height:2px;
  left:-10px;
  bottom:-10px;
  opacity:.01;
  pointer-events:none;
}

/* TOP */
.top-widgets{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
}

.bd-time,.playlist-toggle-btn{
  padding:5px 11px;
  border-radius:20px;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.18);
  color:rgba(255,255,255,.92);
  font-size:11px;
  font-weight:600;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  display:flex;
  align-items:center;
  gap:6px;
}

.playlist-toggle-btn{
  cursor:pointer;
}

.playlist-toggle-btn svg{
  width:14px;
  height:14px;
  fill:#fff;
}

.live-dot{
  width:7px;
  height:7px;
  background:#ff3b30;
  border-radius:50%;
  box-shadow:0 0 8px #ff3b30;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  50%{opacity:.3;transform:scale(.8)}
}

/* PLAYER AREA */
.app{
  position:relative;
  z-index:5;
  width:100%;
  height:100dvh;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:0 12px 60px;
}

.player{
  width:min(460px,96%);
  min-height:120px;
  padding:13px 15px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:64px;
  background:rgba(255,255,255,.055);
  box-shadow:0 20px 60px rgba(0,0,0,.55);
  backdrop-filter:blur(30px) saturate(125%);
  -webkit-backdrop-filter:blur(30px) saturate(125%);
  display:flex;
  align-items:center;
  gap:9px;
  position:relative;
  overflow:hidden;
  touch-action:pan-y;
}

/* COVER */
.cover-wrapper{
  position:relative;
  width:80px;
  height:80px;
  flex-shrink:0;
  border-radius:50%;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.3);
  box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.cover{
  width:137%;
  height:137%;
  margin:-18.5%;
  border-radius:50%;
  object-fit:cover;
  background:#222;
  animation:spin 8s linear infinite;
  animation-play-state:paused;
}

.cover.spinning{animation-play-state:running}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.cover-wrapper:after{
  content:"";
  position:absolute;
  width:16px;
  height:16px;
  background:rgba(15,15,15,.82);
  border:2px solid rgba(255,255,255,.3);
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

/* INFO */
.middle{
  flex:1;
  min-width:0;
}

.title{
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist{
  font-size:11px;
  color:rgba(255,255,255,.68);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin:2px 0 8px;
}

/* SEEK */
.seek{
  position:relative;
  width:100%;
  height:5px;
  border-radius:10px;
  background:rgba(255,255,255,.2);
  margin-bottom:6px;
  cursor:pointer;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.seek:before{
  content:"";
  position:absolute;
  left:-10px;
  right:-10px;
  top:-12px;
  bottom:-12px;
}

.fill{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:0;
  background:#fff;
  border-radius:10px;
  pointer-events:none;
}

.time-display{
  font-size:10px;
  color:rgba(255,255,255,.65);
  font-variant-numeric:tabular-nums;
}

/* CONTROLS */
.controls{
  display:flex;
  align-items:center;
  gap:4px;
  flex-shrink:0;
}

.btn,.skip-btn{
  width:30px;
  height:30px;
  border:0;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  cursor:pointer;
}

.btn svg,.skip-btn svg{
  width:19px;
  height:19px;
  fill:#fff;
}

.btn:active,.skip-btn:active,.play:active{
  transform:scale(.9);
}

.play{
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 15px rgba(0,0,0,.35);
  cursor:pointer;
  flex-shrink:0;
}

.play svg{
  width:20px;
  height:20px;
  fill:#000;
}

/* VOLUME */
.vol-container{
  display:flex;
  align-items:center;
  gap:3px;
  background:rgba(0,0,0,.2);
  border:1px solid rgba(255,255,255,.15);
  padding:3px 5px;
  border-radius:20px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.vol-slider-wrapper{
  width:0;
  overflow:hidden;
  opacity:0;
  display:flex;
  align-items:center;
  transition:width .25s,opacity .2s;
}

.vol-slider-wrapper.active{
  width:55px;
  opacity:1;
  margin-left:2px;
}

.vol-slider{
  appearance:none;
  -webkit-appearance:none;
  width:55px;
  height:3px;
  background:rgba(255,255,255,.3);
  border-radius:10px;
  outline:none;
}

.vol-slider::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#fff;
}

/* DRAWER */
.drawer-overlay{
  position:fixed;
  inset:0;
  z-index:99;
  display:none;
}

.drawer-overlay.active{
  display:block;
}

.playlist-drawer{
  position:fixed;
  top:0;
  right:-190px;
  width:180px;
  height:100dvh;
  z-index:100;
  padding:12px 6px;
  background:rgba(20,20,20,.22);
  backdrop-filter:blur(25px) saturate(150%);
  -webkit-backdrop-filter:blur(25px) saturate(150%);
  border-left:1px solid rgba(255,255,255,.15);
  box-shadow:-10px 0 30px rgba(0,0,0,.3);
  transition:right .35s cubic-bezier(.2,.8,.2,1);
  display:flex;
  flex-direction:column;
}

.playlist-drawer.open{right:0}

.drawer-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 8px;
  border-bottom:1px solid rgba(255,255,255,.15);
  margin-bottom:8px;
  background:rgba(255,255,255,.08);
  border-radius:8px;
}

.drawer-title{
  font-size:11px;
  font-weight:700;
}

.close-btn{
  background:none;
  border:0;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

.song-list{
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.song-item{
  display:flex;
  align-items:center;
  gap:6px;
  padding:4px 5px;
  border-radius:7px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.09);
  cursor:pointer;
}

.song-item.active{
  background:rgba(255,255,255,.18);
  border-color:rgba(255,255,255,.3);
}

.song-item img{
  width:28px;
  height:28px;
  border-radius:5px;
  object-fit:cover;
}

.song-item-info{
  flex:1;
  min-width:0;
}

.song-item-title{
  font-size:9.5px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-item-artist{
  font-size:8px;
  color:rgba(255,255,255,.55);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* MOBILE */
@media(max-width:480px){
  .player{
    width:97%;
    min-height:116px;
    padding:11px 12px;
    gap:7px;
  }

  .cover-wrapper{
    width:76px;
    height:76px;
  }

  .title{font-size:14px}
  .artist{font-size:10px}

  .play{
    width:41px;
    height:41px;
  }

  .controls{gap:2px}
}

@media(max-width:360px){
  .player{
    padding-left:9px;
    padding-right:9px;
    gap:4px;
  }

  .cover-wrapper{
    width:68px;
    height:68px;
  }

  .skip-btn,.btn{
    width:26px;
    height:26px;
  }

  .play{
    width:38px;
    height:38px;
  }
}
</style>
</head>

<body>

<!-- BACKGROUND VIDEO -->
<video
  id="bgVideo"
  class="bg-video"
  src="bg-video.mp4"
  preload="auto"
  playsinline
  webkit-playsinline
  muted
  loop>
</video>

<div class="bg-overlay"></div>

<!-- TOP -->
<div class="top-widgets">

  <div class="bd-time">
    <span>BD</span>
    <span class="live-dot"></span>
    <span id="bdTimeVal">--:--:-- --</span>
  </div>

  <button class="playlist-toggle-btn" id="playlistBtn">
    <svg viewBox="0 0 24 24">
      <path d="M3 10h11v2H3zm0-4h11v2H3zm0 8h7v2H3zm13-1v8l6-4z"/>
    </svg>
    Playlist
  </button>

</div>

<!-- YOUTUBE -->
<div id="yt"></div>

<!-- DRAWER -->
<div class="drawer-overlay" id="overlay"></div>

<div class="playlist-drawer" id="drawer">

  <div class="drawer-header">
    <div class="drawer-title">Playlist Songs</div>
    <button class="close-btn" id="closeDrawer">&times;</button>
  </div>

  <div class="song-list" id="songList">
    <div style="text-align:center;font-size:10px;margin-top:15px">
      Loading...
    </div>
  </div>

</div>

<!-- PLAYER -->
<div class="app">

  <section class="player" id="playerCard">

    <div class="cover-wrapper">
      <img id="cover" class="cover" src="logo.png" alt="">
    </div>

    <div class="middle">

      <div id="title" class="title">My Playlist</div>

      <div id="artist" class="artist">YouTube Music</div>

      <div class="seek" id="seek">
        <div class="fill" id="fill"></div>
      </div>

      <div class="time-display">
        <span id="current">0:00</span>
        /
        <span id="duration">0:00</span>
      </div>

    </div>

    <div class="controls">

      <!-- PREVIOUS -->
      <button class="skip-btn" id="prevBtn">
        <svg viewBox="0 0 24 24">
          <path d="M6 5v14h2V5H6zm3 7l9 7V5l-9 7z"/>
        </svg>
      </button>

      <!-- PLAY -->
      <button class="play" id="playBtn">
        <svg id="playIcon" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>

      <!-- NEXT -->
      <button class="skip-btn" id="nextBtn">
        <svg viewBox="0 0 24 24">
          <path d="M16 5v14h2V5h-2zM6 5v14l9  -7-9-7z"/>
        </svg>
      </button>

      <!-- VOLUME -->
      <div class="vol-container" id="volumeContainer">

        <button class="btn" id="volumeBtn">
          <svg viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>

        <div class="vol-slider-wrapper" id="volWrapper">
          <input
            type="range"
            class="vol-slider"
            id="volSlider"
            min="0"
            max="100"
            value="100">
        </div>

      </div>

    </div>

  </section>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
const PLAYLIST_ID="PLB9TgDHfMHmM";

let player=null;
let playing=false;
let playlistItems=[];
let progressTimer=null;
let isSeeking=false;
let seekPointer=null;
let swipeStartX=0;
let swipeStartY=0;
let volumeTimer=null;

const bgVideo=document.getElementById("bgVideo");
const seek=document.getElementById("seek");
const playerCard=document.getElementById("playerCard");

/* ---------------- BACKGROUND ---------------- */

bgVideo.muted=true;
bgVideo.loop=true;
bgVideo.pause();

function playBackground(){
  bgVideo.muted=true;
  const p=bgVideo.play();
  if(p) p.catch(()=>{});
}

function pauseBackground(){
  bgVideo.pause();
}

/*
  Video stays on its current frame when paused.
  It only moves while music is playing.
*/

/* ---------------- BD TIME ---------------- */

function updateBDTime(){
  document.getElementById("bdTimeVal").textContent=
    new Intl.DateTimeFormat("en-US",{
      timeZone:"Asia/Dhaka",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hour12:true
    }).format(new Date());
}

updateBDTime();
setInterval(updateBDTime,1000);

/* ---------------- YOUTUBE ---------------- */

function onYouTubeIframeAPIReady(){

  player=new YT.Player("yt",{
    width:"2",
    height:"2",

    playerVars:{
      autoplay:0,
      controls:0,
      disablekb:1,
      fs:0,
      modestbranding:1,
      playsinline:1,
      rel:0,
      listType:"playlist",
      list:PLAYLIST_ID
    },

    events:{
      onReady:onReady,
      onStateChange:onStateChange
    }
  });
}

function onReady(){

  progressTimer=setInterval(updateProgress,200);

  setTimeout(loadPlaylist,1000);

  pauseBackground();
}

/* ---------------- STATE ---------------- */

function onStateChange(e){

  if(e.data===YT.PlayerState.PLAYING){

    playing=true;

    document.getElementById("playIcon").innerHTML=
      '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

    document.getElementById("cover")
      .classList.add("spinning");

    playBackground();
    updateInfo();
    highlightActive();

  }

  else if(
    e.data===YT.PlayerState.PAUSED ||
    e.data===YT.PlayerState.ENDED
  ){

    playing=false;

    document.getElementById("playIcon").innerHTML=
      '<path d="M8 5v14l11-7z"/>';

    document.getElementById("cover")
      .classList.remove("spinning");

    pauseBackground();

  }

  highlightActive();
}

/* ---------------- PLAY ---------------- */

document.getElementById("playBtn").onclick=()=>{

  if(!player)return;

  if(playing) player.pauseVideo();
  else player.playVideo();

};

/* ---------------- NEXT / PREVIOUS ---------------- */

function nextSong(){

  if(!player)return;

  player.nextVideo();

}

function previousSong(){

  if(!player)return;

  player.previousVideo();

}

document.getElementById("nextBtn").onclick=nextSong;
document.getElementById("prevBtn").onclick=previousSong;

/* ---------------- VOLUME ---------------- */

function isIOS(){

  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (
      navigator.platform==="MacIntel" &&
      navigator.maxTouchPoints>1
    );

}

/*
  Volume hidden ONLY on iPhone/iPad.
  Android/Windows/Mac/other devices = visible.
*/

if(isIOS()){
  document.getElementById("volumeContainer").style.display="none";
}

document.getElementById("volumeBtn").onclick=()=>{

  const w=document.getElementById("volWrapper");

  w.classList.toggle("active");

  clearTimeout(volumeTimer);

  if(w.classList.contains("active")){
    volumeTimer=setTimeout(()=>{
      w.classList.remove("active");
    },3000);
  }

};

document.getElementById("volSlider").oninput=function(){

  if(player) player.setVolume(Number(this.value));

  clearTimeout(volumeTimer);

};

/* ---------------- PLAYLIST ---------------- */

function loadPlaylist(){

  if(!player || typeof player.getPlaylist!=="function")return;

  playlistItems=player.getPlaylist()||[];

  const list=document.getElementById("songList");

  if(!playlistItems.length){

    list.innerHTML=
      '<div style="text-align:center;font-size:10px;margin-top:15px">No tracks found</div>';

    return;
  }

  list.innerHTML="";

  playlistItems.forEach((id,index)=>{

    const item=document.createElement("div");

    item.className="song-item";
    item.dataset.index=index;

    item.innerHTML=`
      <img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg">
      <div class="song-item-info">
        <div class="song-item-title" id="st-${index}">
          Track ${index+1}
        </div>
        <div class="song-item-artist" id="sa-${index}">
          YouTube Music
        </div>
      </div>
    `;

    item.onclick=()=>{
      player.playVideoAt(index);
      closeDrawer();
    };

    list.appendChild(item);

    getDetails(id,index);

  });

  highlightActive();
  updateInfo();
}

function getDetails(id,index){

  fetch(
    "https://noembed.com/embed?url=https://www.youtube.com/watch?v="+id
  )
  .then(r=>r.json())
  .then(data=>{

    if(!data)return;

    const title=document.getElementById("st-"+index);
    const artist=document.getElementById("sa-"+index);

    if(title && data.title)
      title.textContent=data.title;

    if(artist && data.author_name)
      artist.textContent=data.author_name;

    if(
      player &&
      player.getPlaylistIndex &&
      player.getPlaylistIndex()===index
    ){
      if(data.title)
        document.getElementById("title").textContent=data.title;

      if(data.author_name)
        document.getElementById("artist").textContent=data.author_name;
    }

  })
  .catch(()=>{});

}

/* ---------------- ACTIVE SONG ---------------- */

function highlightActive(){

  if(!player || !player.getPlaylistIndex)return;

  const index=player.getPlaylistIndex();

  document.querySelectorAll(".song-item").forEach((item,i)=>{
    item.classList.toggle("active",i===index);
  });

}

/* ---------------- SONG INFO ---------------- */

function updateInfo(){

  if(!player || !player.getVideoData)return;

  try{

    const data=player.getVideoData();

    if(!data || !data.video_id)return;

    document.getElementById("cover").src=
      "https://i.ytimg.com/vi/"+data.video_id+"/hqdefault.jpg";

    if(data.title)
      document.getElementById("title").textContent=data.title;

    if(data.author)
      document.getElementById("artist").textContent=data.author;

  }catch(e){}

}

/* ---------------- SEEK BAR ---------------- */

/*
  IMPORTANT:
  Pointer events are used only by the seek bar.
  So dragging the seek bar NEVER triggers
  the player's next/previous swipe.
*/

function seekPosition(x){

  const r=seek.getBoundingClientRect();

  return Math.max(
    0,
    Math.min(
      1,
      (x-r.left)/r.width
    )
  );

}

function showSeek(pos){

  document.getElementById("fill").style.width=
    (pos*100)+"%";

  if(player && player.getDuration){

    const d=player.getDuration();

    if(d){
      document.getElementById("current").textContent=
        format(pos*d);
    }

  }

}

seek.addEventListener("pointerdown",e=>{

  if(!player || !player.getDuration)return;

  if(player.getDuration()<=0)return;

  e.preventDefault();
  e.stopPropagation();

  isSeeking=true;
  seekPointer=e.pointerId;

  seek.setPointerCapture(e.pointerId);

  showSeek(seekPosition(e.clientX));

});

seek.addEventListener("pointermove",e=>{

  if(!isSeeking || e.pointerId!==seekPointer)return;

  e.preventDefault();
  e.stopPropagation();

  showSeek(seekPosition(e.clientX));

});

function finishSeek(e){

  if(!isSeeking)return;

  e.preventDefault();
  e.stopPropagation();

  const pos=seekPosition(e.clientX);

  isSeeking=false;
  seekPointer=null;

  showSeek(pos);

  if(player && player.getDuration){

    const d=player.getDuration();

    if(d>0)
      player.seekTo(pos*d,true);

  }

}

seek.addEventListener("pointerup",finishSeek);
seek.addEventListener("pointercancel",finishSeek);

/* ---------------- PROGRESS ---------------- */

function updateProgress(){

  if(isSeeking)return;

  if(!player ||
     !player.getCurrentTime ||
     !player.getDuration)return;

  try{

    const current=player.getCurrentTime();
    const duration=player.getDuration();

    if(!duration || duration<=0)return;

    document.getElementById("fill").style.width=
      ((current/duration)*100)+"%";

    document.getElementById("current").textContent=
      format(current);

    document.getElementById("duration").textContent=
      format(duration);

  }catch(e){}

}

function format(sec){

  if(!sec || isNaN(sec))return "0:00";

  sec=Math.floor(sec);

  return Math.floor(sec/60)+":"+
    String(sec%60).padStart(2,"0");

}

/* ---------------- SWIPE ---------------- */

/*
  Swipe is handled ONLY if the touch
  did NOT start on the seek bar.
*/

playerCard.addEventListener("touchstart",e=>{

  if(e.target.closest(".seek")){
    swipeStartX=null;
    swipeStartY=null;
    return;
  }

  if(e.touches.length!==1)return;

  swipeStartX=e.touches[0].clientX;
  swipeStartY=e.touches[0].clientY;

},{passive:true});

playerCard.addEventListener("touchend",e=>{

  if(swipeStartX===null)return;

  const x=e.changedTouches[0].clientX;
  const y=e.changedTouches[0].clientY;

  const dx=x-swipeStartX;
  const dy=y-swipeStartY;

  swipeStartX=null;
  swipeStartY=null;

  if(Math.abs(dx)<50)return;
  if(Math.abs(dx)<=Math.abs(dy))return;

  if(dx<0) nextSong();
  else previousSong();

},{passive:true});

/* ---------------- DRAWER ---------------- */

function openDrawer(){

  document.getElementById("drawer")
    .classList.add("open");

  document.getElementById("overlay")
    .classList.add("active");

}

function closeDrawer(){

  document.getElementById("drawer")
    .classList.remove("open");

  document.getElementById("overlay")
    .classList.remove("active");

}

document.getElementById("playlistBtn").onclick=openDrawer;
document.getElementById("closeDrawer").onclick=closeDrawer;
document.getElementById("overlay").onclick=closeDrawer;

/* ---------------- BACKGROUND LOOP ---------------- */

bgVideo.addEventListener("ended",()=>{

  bgVideo.currentTime=0;

  if(playing) playBackground();

});

/* ---------------- PAGE VISIBILITY ---------------- */

document.addEventListener("visibilitychange",()=>{

  if(!playing) pauseBackground();

});

/* ---------------- IMAGE DRAG ---------------- */

document.addEventListener("dragstart",e=>{

  if(e.target.tagName==="IMG")
    e.preventDefault();

});
</script>
