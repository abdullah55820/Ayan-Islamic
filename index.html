<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>My Music Player</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">

<link rel="apple-touch-icon"
sizes="180x180"
href="logo.png">

<link rel="icon"
type="image/png"
href="logo.png">


<style>

/* =====================================================
   RESET
===================================================== */

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{

margin:0;
padding:0;

width:100%;
height:100%;

overflow:hidden;

background:#050505;

color:#fff;

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"Segoe UI",
sans-serif;
}

body{
position:relative;
}


/* =====================================================
   BACKGROUND
===================================================== */

.bg{

position:fixed;

inset:0;

background:
url("background.jpg")
center center /
cover
no-repeat;

z-index:0;
}


/* very light overlay */

.bg::after{

content:"";

position:absolute;

inset:0;

background:
rgba(0,0,0,.10);
}


/* =====================================================
   TOP TIME
===================================================== */

.top-widgets{

position:fixed;

top:13px;

left:50%;

transform:
translateX(-50%);

z-index:100;

display:flex;

align-items:center;
}


.bd-time{

display:flex;

align-items:center;

gap:6px;

padding:
5px 11px;

border-radius:20px;

background:
rgba(0,0,0,.32);

border:
1px solid
rgba(255,255,255,.13);

backdrop-filter:
blur(12px);

-webkit-backdrop-filter:
blur(12px);

font-size:10px;

font-weight:600;

letter-spacing:.3px;

color:
rgba(255,255,255,.9);
}


.live-dot{

width:6px;

height:6px;

border-radius:50%;

background:#ff3b30;

box-shadow:
0 0 8px
rgba(255,59,48,.7);

animation:
pulse 1.5s infinite;
}


@keyframes pulse{

0%{
opacity:1;
transform:scale(1);
}

50%{
opacity:.35;
transform:scale(.8);
}

100%{
opacity:1;
transform:scale(1);
}

}


/* =====================================================
   YOUTUBE
===================================================== */

#yt{

position:fixed;

width:2px;
height:2px;

left:-10px;
bottom:-10px;

opacity:.01;

pointer-events:none;
}


/* =====================================================
   MAIN LAYOUT
===================================================== */

.app{

position:relative;

z-index:2;

width:100%;

height:100dvh;

display:flex;

align-items:center;

justify-content:center;

padding:
30px 3vw 20px;

gap:3vw;
}


/* =====================================================
   LEFT PLAYER AREA
===================================================== */

.player-area{

width:52%;

height:100%;

display:flex;

align-items:center;

justify-content:center;

position:relative;
}


/* =====================================================
   PLAYER
===================================================== */

.player{

width:min(460px,100%);

height:124px;

padding:
14px 18px;

border:
1px solid
rgba(255,255,255,.15);

border-radius:62px;

background:
rgba(20,20,20,.28);

backdrop-filter:
blur(18px)
saturate(115%);

-webkit-backdrop-filter:
blur(18px)
saturate(115%);

box-shadow:
0 18px 45px
rgba(0,0,0,.28);

display:flex;

align-items:center;

gap:12px;

position:relative;

overflow:hidden;

touch-action:pan-y;

transition:
transform .3s ease;
}


/* =====================================================
   COVER
===================================================== */

.cover-wrapper{

position:relative;

width:84px;

height:84px;

flex-shrink:0;

display:flex;

align-items:center;

justify-content:center;

border-radius:50%;

overflow:hidden;

border:
1px solid
rgba(255,255,255,.26);

box-shadow:
0 5px 18px
rgba(0,0,0,.28);
}


.cover{

width:137%;

height:137%;

margin:-18.5%;

border-radius:50%;

object-fit:cover;

background:#222;

animation:
spin 8s linear infinite;

animation-play-state:paused;
}


.cover.spinning{

animation-play-state:running;
}


.cover-wrapper::after{

content:"";

position:absolute;

width:15px;

height:15px;

border-radius:50%;

background:
rgba(15,15,15,.9);

border:
2px solid
rgba(255,255,255,.28);

left:50%;

top:50%;

transform:
translate(-50%,-50%);
}


@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}


/* =====================================================
   PLAYER INFO
===================================================== */

.middle{

flex:1;

min-width:0;

display:flex;

flex-direction:column;

justify-content:center;
}


.title{

font-size:16px;

font-weight:700;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

letter-spacing:.1px;
}


.artist{

font-size:12px;

color:
rgba(255,255,255,.58);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:3px;

margin-bottom:9px;
}


/* =====================================================
   SEEK
===================================================== */

.seek{

position:relative;

width:100%;

height:4px;

border-radius:10px;

background:
rgba(255,255,255,.19);

cursor:pointer;

margin-bottom:6px;

touch-action:none;
}


.fill{

position:absolute;

left:0;

top:0;

height:100%;

width:0;

border-radius:10px;

background:#fff;
}


.time-display{

font-size:10px;

color:
rgba(255,255,255,.52);

font-variant-numeric:
tabular-nums;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{

display:flex;

align-items:center;

gap:6px;

flex-shrink:0;
}


.skip-btn{

width:27px;

height:27px;

border:0;

background:transparent;

display:flex;

align-items:center;

justify-content:center;

padding:0;

color:#fff;

cursor:pointer;

transition:
transform .15s;
}


.skip-btn svg{

width:18px;

height:18px;

fill:#fff;
}


.skip-btn:active{

transform:scale(.88);
}


/* PLAY */

.play{

width:43px;

height:43px;

border:0;

border-radius:50%;

background:#fff;

display:flex;

align-items:center;

justify-content:center;

padding:0;

cursor:pointer;

box-shadow:
0 5px 16px
rgba(0,0,0,.25);

transition:
transform .15s;
}


.play:active{

transform:scale(.9);
}


.play svg{

width:19px;

height:19px;

fill:#000;
}


/* =====================================================
   VOLUME
===================================================== */

.vol-container{

display:flex;

align-items:center;

gap:3px;

padding:
4px 6px;

border-radius:20px;

background:
rgba(0,0,0,.20);

border:
1px solid
rgba(255,255,255,.10);
}


.btn{

width:26px;

height:26px;

border:0;

background:transparent;

padding:0;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;
}


.btn svg{

width:18px;

height:18px;

fill:#fff;
}


.vol-slider-wrapper{

width:0;

opacity:0;

overflow:hidden;

transition:
width .25s ease,
opacity .2s ease;
}


.vol-slider-wrapper.active{

width:55px;

opacity:1;
}


.vol-slider{

width:55px;

height:3px;

appearance:none;

-webkit-appearance:none;

background:
rgba(255,255,255,.3);

border-radius:10px;

outline:none;
}


.vol-slider::-webkit-slider-thumb{

appearance:none;

-webkit-appearance:none;

width:10px;

height:10px;

border-radius:50%;

background:#fff;
}


/* =====================================================
   RIGHT PLAYLIST
===================================================== */

.playlist-panel{

width:43%;

height:calc(100dvh - 55px);

max-width:500px;

display:flex;

flex-direction:column;

padding:
8px 8px 12px 18px;

position:relative;
}


/* subtle separator */

.playlist-panel::before{

content:"";

position:absolute;

left:0;

top:8%;

bottom:8%;

width:1px;

background:
linear-gradient(
to bottom,
transparent,
rgba(255,255,255,.12),
transparent
);
}


/* =====================================================
   PLAYLIST HEADER
===================================================== */

.playlist-header{

height:45px;

display:flex;

align-items:center;

justify-content:space-between;

padding:
0 7px;

flex-shrink:0;
}


.playlist-title{

font-size:15px;

font-weight:700;

letter-spacing:.1px;

color:
rgba(255,255,255,.92);
}


.playlist-count{

font-size:9px;

color:
rgba(255,255,255,.4);

padding:
4px 7px;

border-radius:10px;

background:
rgba(255,255,255,.045);
}


/* =====================================================
   SONG LIST
===================================================== */

.song-list{

flex:1;

min-height:0;

overflow-y:auto;

padding:
3px 4px 10px 0;

-webkit-overflow-scrolling:touch;

overscroll-behavior:contain;
}


.song-list::-webkit-scrollbar{

width:2px;
}


.song-list::-webkit-scrollbar-thumb{

background:
rgba(255,255,255,.20);

border-radius:10px;
}


/* =====================================================
   SONG ROW
===================================================== */

.song-item{

position:relative;

height:58px;

min-height:58px;

display:flex;

align-items:center;

gap:10px;

padding:
6px 8px;

margin-bottom:4px;

border-radius:12px;

background:
rgba(255,255,255,.025);

border:
1px solid transparent;

cursor:pointer;

transition:
background .22s ease,
border .22s ease,
transform .15s ease;
}


.song-item:hover{

background:
rgba(255,255,255,.055);

}


.song-item:active{

transform:scale(.985);
}


.song-item.active{

background:
rgba(255,255,255,.085);

border-color:
rgba(255,255,255,.13);

}


/* active line */

.song-item.active::before{

content:"";

position:absolute;

left:0;

top:16px;

bottom:16px;

width:2px;

border-radius:5px;

background:#fff;

box-shadow:
0 0 8px
rgba(255,255,255,.65);
}


/* =====================================================
   NUMBER
===================================================== */

.song-number{

width:18px;

font-size:8px;

text-align:center;

color:
rgba(255,255,255,.32);

flex-shrink:0;
}


.song-item.active .song-number{

color:
rgba(255,255,255,.8);
}


/* =====================================================
   THUMB
===================================================== */

.song-thumb{

width:44px;

height:44px;

border-radius:9px;

overflow:hidden;

background:#222;

flex-shrink:0;

box-shadow:
0 3px 10px
rgba(0,0,0,.22);
}


.song-thumb img{

width:100%;

height:100%;

object-fit:cover;

display:block;
}


/* =====================================================
   SONG INFO
===================================================== */

.song-info{

flex:1;

min-width:0;
}


.song-title{

font-size:10.5px;

font-weight:650;

color:#fff;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;
}


.song-artist{

font-size:8.5px;

color:
rgba(255,255,255,.45);

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-top:3px;
}


/* =====================================================
   EQUALIZER
===================================================== */

.equalizer{

width:18px;

height:16px;

display:flex;

align-items:flex-end;

justify-content:flex-end;

gap:2px;

opacity:0;

flex-shrink:0;
}


.equalizer span{

width:2px;

height:5px;

border-radius:2px;

background:#fff;
}


.song-item.active .equalizer{

opacity:1;
}


.song-item.active
.equalizer span:nth-child(1){

animation:
eq1 .65s infinite alternate;
}


.song-item.active
.equalizer span:nth-child(2){

animation:
eq2 .5s infinite alternate;
}


.song-item.active
.equalizer span:nth-child(3){

animation:
eq3 .8s infinite alternate;
}


@keyframes eq1{

from{
height:3px;
}

to{
height:11px;
}

}


@keyframes eq2{

from{
height:5px;
}

to{
height:15px;
}

}


@keyframes eq3{

from{
height:3px;
}

to{
height:9px;
}

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

.app{

padding:
35px 8px 12px;

gap:0;

}


.player-area{

width:50%;

padding-right:5px;
}


.playlist-panel{

width:50%;

height:
calc(100dvh - 45px);

padding:
5px 5px 8px 10px;
}


.playlist-panel::before{

display:none;
}


.playlist-header{

height:38px;

padding:
0 5px;
}


.playlist-title{

font-size:12px;
}


.playlist-count{

font-size:8px;

padding:
3px 6px;
}


.song-item{

height:52px;

min-height:52px;

gap:6px;

padding:
5px 4px;

border-radius:9px;
}


.song-number{

display:none;
}


.song-thumb{

width:37px;

height:37px;

border-radius:7px;
}


.song-title{

font-size:9px;
}


.song-artist{

font-size:7.5px;

margin-top:2px;
}


.equalizer{

width:12px;

gap:1px;
}


.player{

width:100%;

height:108px;

padding:
10px 10px;

border-radius:54px;

gap:7px;
}


.cover-wrapper{

width:68px;

height:68px;
}


.title{

font-size:12px;
}


.artist{

font-size:9px;

margin-bottom:6px;
}


.seek{

margin-bottom:4px;
}


.time-display{

font-size:8px;
}


.controls{

gap:2px;
}


.skip-btn{

width:22px;

height:22px;
}


.skip-btn svg{

width:15px;

height:15px;
}


.play{

width:38px;

height:38px;
}


.play svg{

width:17px;

height:17px;
}


.vol-container{

display:none;
}

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:380px){

.playlist-panel{

width:52%;
}


.player-area{

width:48%;
}


.song-thumb{

width:34px;

height:34px;
}


.song-item{

height:49px;

min-height:49px;
}


.song-title{

font-size:8.5px;
}


.song-artist{

font-size:7px;
}


.player{

height:102px;
}


.cover-wrapper{

width:62px;

height:62px;
}

}


/* =====================================================
   IOS
===================================================== */

@supports (-webkit-touch-callout:none){

.vol-container{

display:none!important;
}

}

</style>

</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="bg"></div>


<!-- =====================================================
     TIME
===================================================== -->

<div class="top-widgets">

<div class="bd-time">

<span>BD</span>

<span class="live-dot"></span>

<span id="bdTimeVal">
--:--:-- --
</span>

</div>

</div>


<!-- =====================================================
     YOUTUBE
===================================================== -->

<div id="yt"></div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="app">


<!-- ===================================================
     LEFT PLAYER
=================================================== -->

<div class="player-area">


<section
class="player"
id="playerCard"
>


<div class="cover-wrapper">

<img
id="cover"
class="cover"
src="logo.png"
alt=""
>

</div>


<div class="middle">

<div
class="title"
id="title"
>
My Playlist
</div>


<div
class="artist"
id="artist"
>
YouTube Music
</div>


<div
class="seek"
id="seek"
>

<div
class="fill"
id="fill"
></div>

</div>


<div class="time-display">

<span id="current">
0:00
</span>

/

<span id="duration">
0:00
</span>

</div>

</div>


<div class="controls">


<button
class="skip-btn"
onclick="previousSong()"
>

<svg viewBox="0 0 24 24">

<path d="
M6 5h2v14H6z
M20 6.5v11L10 12z
"/>

</svg>

</button>


<button
class="play"
id="play"
onclick="togglePlay()"
>

<svg
id="play-icon"
viewBox="0 0 24 24"
>

<path d="
M8 5v14l11-7z
"/>

</svg>

</button>


<button
class="skip-btn"
onclick="nextSong()"
>

<svg viewBox="0 0 24 24">

<path d="
M16 5h2v14h-2z
M4 6.5v11l10-5.5z
"/>

</svg>

</button>


<div class="vol-container">

<button
class="btn"
onclick="toggleVolume()"
>

<svg viewBox="0 0 24 24">

<path d="
M3 9v6h4l5 5V4L7 9H3
zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05
c1.48-.73 2.5-2.25 2.5-4.02z
M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71
v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z
"/>

</svg>

</button>


<div
class="vol-slider-wrapper"
id="volWrapper"
>

<input
class="vol-slider"
type="range"
min="0"
max="100"
value="100"
oninput="changeVolume(this.value)"
>

</div>

</div>


</div>

</section>

</div>


<!-- ===================================================
     RIGHT PLAYLIST
=================================================== -->

<aside
class="playlist-panel"
>


<div class="playlist-header">

<div class="playlist-title">
Playlist
</div>

<div
class="playlist-count"
id="songCount"
>
0 Songs
</div>

</div>


<div
class="song-list"
id="songList"
>

<div style="
text-align:center;
padding-top:25px;
font-size:10px;
color:rgba(255,255,255,.45);
">
Loading...
</div>

</div>

</aside>


</div>


<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =====================================================
   PLAYLIST
===================================================== */

const PLAYLIST_ID =
"PLB9TgDHfMHmM";


let player = null;

let playing = false;

let playlistItems = [];


/* =====================================================
   BD TIME
===================================================== */

function updateBDTime(){

const options = {

timeZone:
"Asia/Dhaka",

hour:
"2-digit",

minute:
"2-digit",

second:
"2-digit",

hour12:true

};


document
.getElementById("bdTimeVal")
.textContent =
new Intl.DateTimeFormat(
"en-US",
options
).format(new Date());

}


updateBDTime();

setInterval(
updateBDTime,
1000
);


/* =====================================================
   YOUTUBE API
===================================================== */

function onYouTubeIframeAPIReady(){

player =
new YT.Player(
"yt",
{

width:"2",

height:"2",

playerVars:{

autoplay:0,

controls:0,

disablekb:1,

fs:0,

playsinline:1,

rel:0,

modestbranding:1,

listType:"playlist",

list:PLAYLIST_ID

},

events:{

onReady:onReady,

onStateChange:onStateChange

}

});

}


/* =====================================================
   READY
===================================================== */

function onReady(){

loadPlaylistItems();

setInterval(
updateProgress,
250
);

}


/* =====================================================
   STATE
===================================================== */

function onStateChange(event){

if(
event.data ===
YT.PlayerState.PLAYING
){

playing = true;

setPlayingUI(true);

updateInfo();

}

else if(

event.data ===
YT.PlayerState.PAUSED ||

event.data ===
YT.PlayerState.ENDED

){

playing = false;

setPlayingUI(false);

}


highlightActiveTrack();

}


/* =====================================================
   PLAY UI
===================================================== */

function setPlayingUI(active){

const icon =
document.getElementById(
"play-icon"
);

const cover =
document.getElementById(
"cover"
);


if(active){

icon.innerHTML = `
<path d="
M6 19h4V5H6v14zm8-14v14h4V5h-4z
"/>
`;

cover.classList.add(
"spinning"
);

}

else{

icon.innerHTML = `
<path d="
M8 5v14l11-7z
"/>
`;

cover.classList.remove(
"spinning"
);

}

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

function togglePlay(){

if(!player)
return;


if(playing){

player.pauseVideo();

}

else{

player.playVideo();

}

}


/* =====================================================
   NEXT
===================================================== */

function nextSong(){

if(
!player ||
!playlistItems.length
)
return;


const current =
player.getPlaylistIndex();


const next =
(current + 1) %
playlistItems.length;


player.playVideoAt(next);

forceUpdateUI(next);

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousSong(){

if(
!player ||
!playlistItems.length
)
return;


const current =
player.getPlaylistIndex();


const previous =
(current - 1 +
playlistItems.length) %
playlistItems.length;


player.playVideoAt(previous);

forceUpdateUI(previous);

}


/* =====================================================
   FORCE UI
===================================================== */

function forceUpdateUI(index){

if(
!playlistItems[index]
)
return;


const id =
playlistItems[index];


document
.getElementById("cover")
.src =
`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;


const title =
document.getElementById(
`title-${index}`
);


const artist =
document.getElementById(
`artist-${index}`
);


if(title){

document
.getElementById("title")
.textContent =
title.textContent;

}


if(artist){

document
.getElementById("artist")
.textContent =
artist.textContent;

}


highlightActiveTrack();

scrollActive(index);

}


/* =====================================================
   VOLUME
===================================================== */

let volumeTimer = null;


function toggleVolume(){

const wrapper =
document.getElementById(
"volWrapper"
);


if(
wrapper.classList.contains(
"active"
)
){

wrapper.classList.remove(
"active"
);

if(volumeTimer)
clearTimeout(volumeTimer);

}

else{

wrapper.classList.add(
"active"
);

volumeTimer =
setTimeout(
()=>{
wrapper.classList.remove(
"active"
);
},
3000
);

}

}


function changeVolume(value){

if(
player &&
player.setVolume
){

player.setVolume(value);

}

}


/* =====================================================
   SEEK
===================================================== */

const seek =
document.getElementById(
"seek"
);

let dragging = false;


function getSeekPosition(x){

const rect =
seek.getBoundingClientRect();


return Math.max(
0,
Math.min(
1,
(x - rect.left) /
rect.width
)
);

}


seek.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

e.stopPropagation();

dragging = true;

seek.setPointerCapture(
e.pointerId
);

const pos =
getSeekPosition(
e.clientX
);


document
.getElementById("fill")
.style.width =
(pos*100)+"%";

},
{
passive:false
}
);


seek.addEventListener(
"pointermove",
e=>{

if(!dragging)
return;


e.preventDefault();


const pos =
getSeekPosition(
e.clientX
);


document
.getElementById("fill")
.style.width =
(pos*100)+"%";

},
{
passive:false
}
);


seek.addEventListener(
"pointerup",
e=>{

if(!dragging)
return;


dragging = false;


const pos =
getSeekPosition(
e.clientX
);


if(
player &&
player.getDuration
){

player.seekTo(
pos *
player.getDuration(),
true
);

}

},
{
passive:false
}
);


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

if(
dragging ||
!player ||
!player.getDuration
)
return;


const duration =
player.getDuration();


if(!duration)
return;


const current =
player.getCurrentTime();


const percent =
(current / duration) * 100;


document
.getElementById("fill")
.style.width =
percent+"%";


document
.getElementById("current")
.textContent =
formatTime(current);


document
.getElementById("duration")
.textContent =
formatTime(duration);

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(seconds){

if(
!seconds ||
isNaN(seconds)
)
return "0:00";


seconds =
Math.floor(seconds);


return (
Math.floor(seconds/60)
+
":"+
String(
seconds%60
).padStart(2,"0")
);

}


/* =====================================================
   LOAD PLAYLIST
===================================================== */

function loadPlaylistItems(){

if(
!player ||
!player.getPlaylist
)
return;


playlistItems =
player.getPlaylist();


const list =
document.getElementById(
"songList"
);


const count =
document.getElementById(
"songCount"
);


if(
!playlistItems ||
!playlistItems.length
){

list.innerHTML = `
<div style="
text-align:center;
padding-top:25px;
font-size:10px;
color:rgba(255,255,255,.45);
">
No songs found
</div>
`;

return;

}


count.textContent =
playlistItems.length +
(
playlistItems.length === 1
?
" Song"
:
" Songs"
);


list.innerHTML = "";


playlistItems.forEach(
(id,index)=>{

const item =
document.createElement(
"div"
);


item.className =
"song-item";


item.id =
`track-${index}`;


item.onclick =
()=>{
playSpecificTrack(index);
};


item.innerHTML = `

<div class="song-number">
${index+1}
</div>


<div class="song-thumb">

<img
src="https://i.ytimg.com/vi/${id}/hqdefault.jpg"
loading="lazy"
alt=""
>

</div>


<div class="song-info">

<div
class="song-title"
id="title-${index}"
>
Track ${index+1}
</div>

<div
class="song-artist"
id="artist-${index}"
>
YouTube Music
</div>

</div>


<div class="equalizer">

<span></span>
<span></span>
<span></span>

</div>

`;


list.appendChild(item);


fetchSongDetails(
id,
index
);

});


highlightActiveTrack();

updateInfo();

}


/* =====================================================
   SONG DETAILS
===================================================== */

function fetchSongDetails(
id,
index
){

fetch(
`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
)

.then(
response =>
response.json()
)

.then(
data=>{

const title =
document.getElementById(
`title-${index}`
);


const artist =
document.getElementById(
`artist-${index}`
);


if(
title &&
data.title
){

title.textContent =
data.title;

}


if(
artist &&
data.author_name
){

artist.textContent =
data.author_name;

}

})

.catch(
()=>{}
);

}


/* =====================================================
   PLAY SPECIFIC
===================================================== */

function playSpecificTrack(index){

if(
!player ||
!playlistItems[index]
)
return;


player.playVideoAt(index);

forceUpdateUI(index);

}


/* =====================================================
   ACTIVE SONG
===================================================== */

function highlightActiveTrack(){

if(
!player ||
!player.getPlaylistIndex
)
return;


const current =
player.getPlaylistIndex();


document
.querySelectorAll(".song-item")
.forEach(
(item,index)=>{

item.classList.toggle(
"active",
index === current
);

});

}


/* =====================================================
   SCROLL ACTIVE
===================================================== */

function scrollActive(index){

const item =
document.getElementById(
`track-${index}`
);


if(!item)
return;


item.scrollIntoView({

behavior:"smooth",

block:"nearest"

});

}


/* =====================================================
   PLAYER INFO
===================================================== */

function updateInfo(){

if(
!player ||
!player.getVideoData
)
return;


const data =
player.getVideoData();


if(
!data ||
!data.video_id
)
return;


document
.getElementById("cover")
.src =
`https://i.ytimg.com/vi/${data.video_id}/hqdefault.jpg`;


if(data.title){

document
.getElementById("title")
.textContent =
data.title;

}


if(data.author){

document
.getElementById("artist")
.textContent =
data.author;

}

}


/* =====================================================
   SWIPE PLAYER
===================================================== */

let startX = 0;

let startY = 0;

let swiping = false;


const playerCard =
document.getElementById(
"playerCard"
);


playerCard.addEventListener(
"pointerdown",
e=>{

if(
e.target.closest("#seek")
)
return;


startX =
e.clientX;

startY =
e.clientY;

swiping = true;

});


playerCard.addEventListener(
"pointerup",
e=>{

if(!swiping)
return;


const dx =
e.clientX -
startX;


const dy =
e.clientY -
startY;


swiping = false;


if(
Math.abs(dx)<50 ||
Math.abs(dy)>
Math.abs(dx)
)
return;


if(dx<0){

nextSong();

}

else{

previousSong();

}

});


playerCard.addEventListener(
"pointercancel",
()=>{

swiping=false;

});

</script>
