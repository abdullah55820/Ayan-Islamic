<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdullah Live TV</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans antialiased h-screen flex flex-col">

    <header class="bg-slate-800 p-4 text-center shadow-lg border-b border-red-500 shrink-0">
        <h1 class="text-2xl font-bold text-red-500">📺 Abdullah's Sports Portal</h1>
    </header>

    <div class="flex flex-col md:flex-row flex-1 overflow-hidden">
        
        <div class="flex-1 bg-black flex items-center justify-center p-4">
            <div id="player" class="w-full max-w-4xl aspect-video rounded-lg overflow-hidden shadow-2xl"></div>
        </div>

        <div class="w-full md:w-80 bg-slate-800 p-4 flex flex-col border-l border-slate-700 shrink-0 h-full">
            <h3 class="font-semibold text-lg border-b border-slate-600 pb-2 mb-4 text-slate-300">Channels</h3>
            <div id="channel-list" class="space-y-2 overflow-y-auto flex-1 pb-20">
                </div>
        </div>

    </div>

    <script>
        // APA TO TO AMI APNAR MAIN CHANNELS GULO DIRECT BOSHIYE DIYECHHI JATE O ERROR NA DEY
        const channels = [
            {
                name: "BD vs AUS | Tapmad Sports",
                url: "https://premierleagpl23.akamaized.net/hls/live/2107108/tapmad-P2s6L_FiN@L-UrU/master.m3u8"
            },
            {
                name: "Sports Stream 2",
                url: "https://premierleagpl23.akamaized.net/key/live/2107108/tapmad-P2s6L_FiN@L-UrU/master.m3u8"
            }
        ];

        var player;

        function displayChannels() {
            const container = document.getElementById('channel-list');
            container.innerHTML = '';

            channels.forEach((channel) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-slate-700 hover:bg-red-600 p-3 rounded-md transition text-sm font-medium block truncate";
                btn.innerHTML = `🎥 ${channel.name}`;
                btn.onclick = () => playChannel(channel.url);
                container.appendChild(btn);
            });

            // Auto play first channel
            if (channels.length > 0 && !player) {
                playChannel(channels[0].url);
            }
        }

        function playChannel(url) {
            if (player) { player.destroy(); }
            player = new Clappr.Player({
                source: url,
                parentId: "#player",
                width: "100%",
                height: "100%",
                autoPlay: true,
                mimeType: "application/x-mpegURL"
            });
        }

        window.onload = displayChannels;
    </script>
</body>
</html>
