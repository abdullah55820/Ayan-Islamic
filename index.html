<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>My Music Player</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">

<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif
}

body{
  position:relative
}

/* =========================
   BACKGROUND VIDEO
========================= */

#bgVideo{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:calc(-1 * env(safe-area-inset-bottom));

  width:100%;
  height:calc(100% + env(safe-area-inset-bottom));

  object-fit:cover;
  object-position:center;

  z-index:0;

  display:block;

  background:#000;

  pointer-events:none;

  /* Helps mobile browsers */
  transform:translateZ(0);
  -webkit-transform:translateZ(0);

  /* Prevent weird video selection */
  user-select:none;
  -webkit-user-select:none;
}

.bg-overlay{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:calc(-1 * env(safe-area-inset-bottom));

  z-index:1;

  background:rgba(0,0,0,.12);

  pointer-events:none
}

/* =========================
   TOP
========================= */

.top{
  position:fixed;

  top:calc(10px + env(safe-area-inset-top));

  left:50%;

  transform:translateX(-50%);

  z-index:20;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:8px
}

.bd,
.playlist-btn{
  border:1px solid rgba(255,255,255,.18);

  background:rgba(0,0,0,.35);

  color:#fff;

  border-radius:20px;

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  font-weight:600
}

.bd{
  padding:5px 11px;

  font-size:11px;

  display:flex;
  align-items:center;

  gap:6px
}

.dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#ff3b30;

  box-shadow:0 0 8px #ff3b30;

  animation:pulse 1.5s infinite
}

@keyframes pulse{
  50%{
    opacity:.3;
    transform:scale(.8)
  }
}

.playlist-btn{
  padding:5px 12px;

  font-size:11px;

  display:flex;
  align-items:center;

  gap:6px;

  cursor:pointer
}

.playlist-btn svg{
  width:14px;
  height:14px;

  fill:#fff
}

/* =========================
   HIDDEN YOUTUBE
========================= */

#yt{
  position:fixed;

  width:2px;
  height:2px;

  left:-10px;
  bottom:-10px;

  opacity:.01;

  pointer-events:none
}

/* =========================
   APP
========================= */

.app{
  position:relative;

  z-index:5;

  width:100%;
  height:100dvh;

  display:flex;

  align-items:flex-end;
  justify-content:center;

  padding:
    0
    16px
    calc(55px + env(safe-area-inset-bottom))
}

/* =========================
   PLAYER
========================= */

.player{
  width:min(460px,96%);

  min-height:126px;

  padding:14px 16px;

  display:flex;
  align-items:center;

  gap:10px;

  position:relative;

  overflow:hidden;

  border:1px solid rgba(255,255,255,.2);

  border-radius:64px;

  background:rgba(255,255,255,.055);

  box-shadow:0 20px 60px rgba(0,0,0,.55);

  backdrop-filter:blur(30px) saturate(125%);
  -webkit-backdrop-filter:blur(30px) saturate(125%);

  touch-action:pan-y
}

/* =========================
   COVER
========================= */

.cover-wrap{
  width:84px;
  height:84px;

  flex-shrink:0;

  border-radius:50%;

  overflow:hidden;

  position:relative;

  border:1px solid rgba(255,255,255,.3);

  box-shadow:0 5px 20px rgba(0,0,0,.35)
}

.cover{
  width:137%;
  height:137%;

  margin:-18.5%;

  border-radius:50%;

  object-fit:cover;

  background:#222;

  animation:spin 8s linear infinite;

  animation-play-state:paused
}

.cover.spin{
  animation-play-state:running
}

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}

.cover-wrap:after{
  content:"";

  position:absolute;

  width:16px;
  height:16px;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:rgba(15,15,15,.82);

  border:2px solid rgba(255,255,255,.3)
}

/* =========================
   INFO
========================= */

.middle{
  flex:1;
  min-width:0
}

.title{
  font-size:16px;

  font-weight:700;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis
}

.artist{
  margin:2px 0 8px;

  font-size:12px;

  color:rgba(255,255,255,.68);

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis
}

/* =========================
   SEEK
========================= */

.seek{
  position:relative;

  width:100%;
  height:5px;

  border-radius:10px;

  background:rgba(255,255,255,.2);

  cursor:pointer;

  margin-bottom:6px;

  touch-action:none;

  user-select:none
}

.seek:before{
  content:"";

  position:absolute;

  top:-12px;
  bottom:-12px;

  left:-10px;
  right:-10px
}

.fill{
  position:absolute;

  left:0;
  top:0;

  height:100%;
  width:0;

  border-radius:10px;

  background:#fff;

  pointer-events:none
}

.time{
  font-size:11px;

  color:rgba(255,255,255,.65);

  font-variant-numeric:tabular-nums
}

/* =========================
   CONTROLS
========================= */

.controls{
  display:flex;

  align-items:center;

  gap:5px;

  flex-shrink:0
}

.btn,
.skip{
  width:30px;
  height:30px;

  border:0;

  background:transparent;

  color:#fff;

  padding:0;

  display:flex;

  align-items:center;

  justify-content:center;

  cursor:pointer
}

.btn svg,
.skip svg{
  width:19px;
  height:19px;

  fill:#fff
}

.btn:active,
.skip:active,
.play:active{
  transform:scale(.9)
}

.play{
  width:45px;
  height:45px;

  border:0;

  border-radius:50%;

  background:#fff;

  color:#000;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-shrink:0;

  box-shadow:0 4px 15px rgba(0,0,0,.35);

  cursor:pointer
}

.play svg{
  width:20px;
  height:20px;

  fill:#000
}

/* =========================
   VOLUME
========================= */

.volume{
  display:flex;

  align-items:center;

  gap:4px;

  padding:4px 6px;

  border-radius:20px;

  background:rgba(0,0,0,.2);

  border:1px solid rgba(255,255,255,.15);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px)
}

.vol-wrap{
  width:0;

  opacity:0;

  overflow:hidden;

  transition:.25s;

  display:flex;

  align-items:center
}

.vol-wrap.active{
  width:55px;

  opacity:1;

  margin-left:2px
}

.vol{
  width:55px;
  height:3.5px;

  appearance:none;
  -webkit-appearance:none;

  background:rgba(255,255,255,.3);

  border-radius:10px;

  outline:0
}

.vol::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;

  width:10px;
  height:10px;

  border-radius:50%;

  background:#fff
}

/* =========================
   DRAWER
========================= */

.overlay{
  position:fixed;

  inset:0;

  z-index:90;

  display:none
}

.overlay.show{
  display:block
}

.drawer{
  position:fixed;

  top:0;
  right:-190px;

  width:180px;
  height:100dvh;

  z-index:100;

  padding:12px 6px;

  visibility:hidden;

  pointer-events:none;

  background:rgba(20,20,20,.22);

  border-left:1px solid rgba(255,255,255,.15);

  backdrop-filter:blur(25px) saturate(150%);
  -webkit-backdrop-filter:blur(25px) saturate(150%);

  box-shadow:-10px 0 30px rgba(0,0,0,.3);

  transition:right .35s cubic-bezier(.2,.8,.2,1);

  display:flex;

  flex-direction:column
}

.drawer.open{
  right:0;

  visibility:visible;

  pointer-events:auto
}

.drawer-head{
  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:6px 8px;

  margin-bottom:8px;

  border-bottom:1px solid rgba(255,255,255,.15);

  background:rgba(255,255,255,.08);

  border-radius:8px
}

.drawer-title{
  font-size:11px;

  font-weight:700
}

.close{
  border:0;

  background:transparent;

  color:#fff;

  font-size:18px;

  cursor:pointer
}

.song-list{
  flex:1;

  overflow-y:auto;

  display:flex;

  flex-direction:column;

  gap:4px
}

.song{
  display:flex;

  align-items:center;

  gap:6px;

  padding:4px 5px;

  border-radius:7px;

  background:rgba(255,255,255,.06);

  border:1px solid rgba(255,255,255,.09);

  cursor:pointer
}

.song.active{
  background:rgba(255,255,255,.18);

  border-color:rgba(255,255,255,.3)
}

.song img{
  width:28px;
  height:28px;

  border-radius:5px;

  object-fit:cover;

  flex-shrink:0
}

.song-info{
  flex:1;

  min-width:0
}

.song-title{
  font-size:9.5px;

  font-weight:700;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis
}

.song-artist{
  font-size:8px;

  color:rgba(255,255,255,.55);

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis
}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

  .player{
    width:96%;

    min-height:116px;

    padding:12px 13px;

    border-radius:60px;

    gap:8px
  }

  .cover-wrap{
    width:78px;
    height:78px
  }

  .title{
    font-size:15px
  }

  .artist{
    font-size:11px
  }

  .play{
    width:42px;
    height:42px
  }
}

@media(max-width:360px){

  .player{
    gap:4px;

    padding-left:9px;
    padding-right:9px
  }

  .cover-wrap{
    width:70px;
    height:70px
  }

  .controls{
    gap:1px
  }

  .btn,
  .skip{
    width:27px;
    height:27px
  }

  .play{
    width:39px;
    height:39px
  }
}
</style>
</head>

<body>

<!-- =====================================================
     BACKGROUND VIDEO
     autoplay + muted + playsinline = mobile autoplay
===================================================== -->

<video
  id="bgVideo"
  src="bg-video.mp4"
  class="bg-video"
  muted
  autoplay
  loop
  playsinline
  webkit-playsinline
  preload="auto"
  x5-playsinline
  x5-video-player-type="h5"
  x5-video-player-fullscreen="false">
</video>

<div class="bg-overlay"></div>


<!-- TOP -->

<div class="top">

  <div class="bd">

    <span>BD</span>

    <span class="dot"></span>

    <span id="bdTime">
      --:--:-- --
    </span>

  </div>


  <button
    class="playlist-btn"
    onclick="toggleDrawer()">

    <svg viewBox="0 0 24 24">

      <path d="M3 10h11v2H3zm0-4h11v2H3zm0 8h7v2H3zm13-1v8l6-4z"/>

    </svg>

    Playlist

  </button>

</div>


<!-- HIDDEN YOUTUBE -->

<div id="yt"></div>


<!-- DRAWER OVERLAY -->

<div
  class="overlay"
  id="overlay"
  onclick="toggleDrawer()">
</div>


<!-- DRAWER -->

<div
  class="drawer"
  id="drawer">

  <div class="drawer-head">

    <div class="drawer-title">
      Playlist Songs
    </div>

    <button
      class="close"
      onclick="toggleDrawer()">

      ×

    </button>

  </div>


  <div
    class="song-list"
    id="songList">

    <div
      style="
        text-align:center;
        font-size:10px;
        margin-top:15px
      ">

      Loading...

    </div>

  </div>

</div>


<!-- APP -->

<div class="app">

  <section
    class="player"
    id="playerCard">


    <!-- COVER -->

    <div class="cover-wrap">

      <img
        id="cover"
        class="cover"
        src="logo.png"
        alt="Album">

    </div>


    <!-- INFO -->

    <div class="middle">

      <div
        id="title"
        class="title">

        My Playlist

      </div>


      <div
        id="artist"
        class="artist">

        YouTube Music

      </div>


      <!-- SEEK -->

      <div
        class="seek"
        id="seek">

        <div
          class="fill"
          id="fill">
        </div>

      </div>


      <!-- TIME -->

      <div class="time">

        <span id="current">
          0:00
        </span>

        /

        <span id="duration">
          0:00
        </span>

      </div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">


      <!-- PREVIOUS -->

      <button
        class="skip"
        onclick="previousSong()"
        aria-label="Previous">

        <svg viewBox="0 0 24 24">

          <path d="M6 5v14h2V5H6zm3 7l9 7V5l-9 7z"/>

        </svg>

      </button>


      <!-- PLAY -->

      <button
        class="play"
        id="play"
        onclick="togglePlay()">

        <svg
          id="playIcon"
          viewBox="0 0 24 24">

          <path d="M8 5v14l11-7z"/>

        </svg>

      </button>


      <!-- NEXT -->

      <button
        class="skip"
        onclick="nextSong()"
        aria-label="Next">

        <svg viewBox="0 0 24 24">

          <path d="M16 5v14h2V5h-2zM6 5v14l9 7-9-7z"/>

        </svg>

      </button>


      <!-- VOLUME -->

      <div class="volume">

        <button
          class="btn"
          onclick="toggleVolume()">

          <svg viewBox="0 0 24 24">

            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>

          </svg>

        </button>


        <div
          class="vol-wrap"
          id="volWrap">

          <input
            class="vol"
            id="volSlider"
            type="range"
            min="0"
            max="100"
            value="100"
            oninput="changeVolume(this.value)">

        </div>

      </div>

    </div>

  </section>

</div>


<!-- YOUTUBE API -->

<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =====================================================
   PLAYLIST
===================================================== */

const PLAYLIST_ID = "PLB9TgDHfMHmM";


/* =====================================================
   VARIABLES
===================================================== */

let player = null;

let playing = false;

let playlistItems = [];

let progressTimer = null;

let isDragging = false;

let swipeStartX = 0;

let swipeStartY = 0;

let volTimer = null;


/* =====================================================
   ELEMENTS
===================================================== */

const bgVideo =
  document.getElementById("bgVideo");

const seek =
  document.getElementById("seek");

const cover =
  document.getElementById("cover");

const title =
  document.getElementById("title");

const artist =
  document.getElementById("artist");


/* =====================================================
   BACKGROUND VIDEO AUTOPLAY
===================================================== */

/*
   Try immediately.
   muted + playsinline allows autoplay on most browsers.
*/

function playBackground(){

  if(!bgVideo)
    return;

  bgVideo.muted = true;

  bgVideo.setAttribute("muted","");

  bgVideo.setAttribute("playsinline","");

  bgVideo.setAttribute("webkit-playsinline","");

  const promise = bgVideo.play();

  if(promise){

    promise.catch(()=>{

      /*
        Browser blocked autoplay.

        We try again after the page becomes
        visible or receives interaction.
      */

    });

  }

}


/*
   Try as early as possible.
*/

playBackground();


/*
   When DOM is loaded.
*/

document.addEventListener(
  "DOMContentLoaded",
  ()=>{

    bgVideo.muted = true;

    bgVideo.load();

    playBackground();

  }
);


/*
   When whole page is loaded.
*/

window.addEventListener(
  "load",
  ()=>{

    bgVideo.muted = true;

    playBackground();

  }
);


/*
   iOS Safari sometimes needs pageshow.
*/

window.addEventListener(
  "pageshow",
  ()=>{

    playBackground();

  }
);


/*
   If user returns to the tab.
*/

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.visibilityState === "visible"
    ){

      playBackground();

    }

  }
);


/*
   If video somehow pauses while music is
   still playing, try to restart it.
*/

bgVideo.addEventListener(
  "pause",
  ()=>{

    if(playing){

      setTimeout(
        playBackground,
        50
      );

    }

  }
);


/*
   Video ended.

   Loop should handle this, but we also
   manually restart as a fallback.
*/

bgVideo.addEventListener(
  "ended",
  ()=>{

    bgVideo.currentTime = 0;

    playBackground();

  }
);


/*
   First user interaction fallback.

   This is especially useful for browsers
   that block autoplay.
*/

[
  "touchstart",
  "touchend",
  "click",
  "pointerdown"
].forEach(eventName=>{

  document.addEventListener(
    eventName,
    ()=>{
      playBackground();
    },
    {
      once:false,
      passive:true
    }
  );

});


/* =====================================================
   BD TIME
===================================================== */

function updateBDTime(){

  document.getElementById(
    "bdTime"
  ).textContent =

    new Intl.DateTimeFormat(
      "en-US",
      {
        timeZone:"Asia/Dhaka",

        hour:"2-digit",

        minute:"2-digit",

        second:"2-digit",

        hour12:true
      }
    ).format(
      new Date()
    );

}

updateBDTime();

setInterval(
  updateBDTime,
  1000
);


/* =====================================================
   YOUTUBE
===================================================== */

function onYouTubeIframeAPIReady(){

  player = new YT.Player(
    "yt",
    {

      width:"2",

      height:"2",

      playerVars:{
        autoplay:0,

        controls:0,

        disablekb:1,

        fs:0,

        modestbranding:1,

        playsinline:1,

        rel:0,

        cc_load_policy:0,

        iv_load_policy:3,

        listType:"playlist",

        list:PLAYLIST_ID
      },

      events:{
        onReady:onReady,

        onStateChange:onStateChange
      }

    }
  );

}


/* =====================================================
   YOUTUBE READY
===================================================== */

function onReady(){

  progressTimer =
    setInterval(
      updateProgress,
      200
    );

  setTimeout(
    loadPlaylist,
    800
  );

}


/* =====================================================
   YOUTUBE STATE
===================================================== */

function onStateChange(e){

  if(
    e.data ===
    YT.PlayerState.PLAYING
  ){

    playing = true;


    document.getElementById(
      "playIcon"
    ).innerHTML =

      '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';


    cover.classList.add(
      "spin"
    );


    updateInfo();

    highlightActive();


    /*
       Music started.
       Keep background video playing.
    */

    playBackground();

  }


  else if(

    e.data ===
    YT.PlayerState.PAUSED ||

    e.data ===
    YT.PlayerState.ENDED

  ){

    playing = false;


    document.getElementById(
      "playIcon"
    ).innerHTML =

      '<path d="M8 5v14l11-7z"/>';


    cover.classList.remove(
      "spin"
    );


    /*
       Stop background when music pauses.
    */

    bgVideo.pause();

  }


  if(
    e.data ===
    YT.PlayerState.ENDED
  ){

    setTimeout(
      updateInfo,
      50
    );

    setTimeout(
      highlightActive,
      50
    );

  }

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

function togglePlay(){

  if(!player)
    return;


  if(playing){

    player.pauseVideo();

  }else{

    player.playVideo();

    /*
       Also start background immediately.
    */

    playBackground();

  }

}


/* =====================================================
   CURRENT INDEX
===================================================== */

function getCurrentIndex(){

  if(
    !player ||
    !player.getPlaylistIndex
  )
    return 0;


  const index =
    player.getPlaylistIndex();


  return index < 0
    ? 0
    : index;

}


/* =====================================================
   NEXT
===================================================== */

function nextSong(){

  if(!player)
    return;


  const current =
    getCurrentIndex();


  if(
    playlistItems.length
  ){

    const next =
      (current + 1) %
      playlistItems.length;


    showTrack(next);


    player.playVideoAt(
      next
    );

  }else{

    player.nextVideo();

  }


  setTimeout(
    updateInfo,
    100
  );

  setTimeout(
    highlightActive,
    100
  );

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousSong(){

  if(!player)
    return;


  const current =
    getCurrentIndex();


  if(
    playlistItems.length
  ){

    const prev =
      (
        current -
        1 +
        playlistItems.length
      ) %
      playlistItems.length;


    showTrack(prev);


    player.playVideoAt(
      prev
    );

  }else{

    player.previousVideo();

  }


  setTimeout(
    updateInfo,
    100
  );

  setTimeout(
    highlightActive,
    100
  );

}


/* =====================================================
   SHOW TRACK
===================================================== */

function showTrack(index){

  if(
    !playlistItems[index]
  )
    return;


  const id =
    playlistItems[index];


  cover.src =
    `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;


  const titleElement =
    document.querySelector(
      `#title-${index}`
    );


  const artistElement =
    document.querySelector(
      `#artist-${index}`
    );


  title.textContent =
    titleElement
      ? titleElement.textContent
      : "Loading...";


  artist.textContent =
    artistElement
      ? artistElement.textContent
      : "YouTube Music";


  document
    .querySelectorAll(".song")
    .forEach(
      (el,i)=>{

        el.classList.toggle(
          "active",
          i === index
        );

      }
    );

}


/* =====================================================
   VOLUME
===================================================== */

function toggleVolume(){

  const wrap =
    document.getElementById(
      "volWrap"
    );


  wrap.classList.toggle(
    "active"
  );


  clearTimeout(
    volTimer
  );


  if(
    wrap.classList.contains(
      "active"
    )
  ){

    volTimer =
      setTimeout(
        ()=>{
          wrap.classList.remove(
            "active"
          );
        },
        3000
      );

  }

}


function changeVolume(value){

  if(
    player &&
    player.setVolume
  ){

    player.setVolume(
      Number(value)
    );

  }


  clearTimeout(
    volTimer
  );


  volTimer =
    setTimeout(
      ()=>{

        document
          .getElementById(
            "volWrap"
          )
          .classList.remove(
            "active"
          );

      },
      3000
    );

}


/* =====================================================
   IOS VOLUME
===================================================== */

(function(){

  const ios =
    /iPhone|iPad|iPod/.test(
      navigator.userAgent
    ) ||

    (
      navigator.platform ===

    );

      )
      .style.display =

/* =====================================================
   DRAWER
===================================================== */

function toggleDrawer(){

  const drawer =
    document.getElementById(
      "drawer"
    );


  const overlay =
    document.getElementById(
      "overlay"
    );


  const open =
    drawer.classList.toggle(
      "open"
    );


  overlay.classList.toggle(
    "show",
    open
  );

}


/* =====================================================
   LOAD PLAYLIST
===================================================== */

function loadPlaylist(){

  if(
    !player ||
    !player.getPlaylist
  )
    return;


  playlistItems =
    player.getPlaylist() || [];


  const list =
    document.getElementById(
      "songList"
    );


  if(
    !playlistItems.length
  ){

    list.innerHTML =
      `
      <div
        style="
          text-align:center;
          font-size:10px;
          margin-top:15px
        "
      >
        No tracks found
      </div>
      `;

    return;

  }


  list.innerHTML = "";


  playlistItems.forEach(
    (id,index)=>{

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "song";


      item.id =
        "track-" + index;


      item.innerHTML = `

        <img
          src="https://i.ytimg.com/vi/${id}/hqdefault.jpg"
          alt="thumb"
        >

        <div class="song-info">

          <div
            class="song-title"
            id="title-${index}"
          >
            Track ${index + 1}
          </div>

          <div
            class="song-artist"
            id="artist-${index}"
          >
            YouTube Music
          </div>

        </div>

      `;


      item.onclick = ()=>{

        showTrack(index);

        player.playVideoAt(
          index
        );

        playBackground();

        toggleDrawer();

      };


      list.appendChild(
        item
      );


      getDetails(
        id,
        index
      );

    }
  );


  showTrack(
    getCurrentIndex()
  );

}


/* =====================================================
   DETAILS
===================================================== */

function getDetails(
  id,
  index
){

  fetch(
    `https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
  )

  .then(
    r => r.json()
  )

  .then(
    data => {

      if(!data)
        return;


      const titleElement =
        document.getElementById(
          "title-" + index
        );


      const artistElement =
        document.getElementById(
          "artist-" + index
        );


      if(
        data.title &&
        titleElement
      ){

        titleElement.textContent =
          data.title;

      }


      if(
        data.author_name &&
        artistElement
      ){

        artistElement.textContent =
          data.author_name;

      }


      if(
        player &&
        player.getPlaylistIndex &&
        player.getPlaylistIndex() === index
      ){

        if(data.title){

          title.textContent =
            data.title;

        }


        if(data.author_name){

          artist.textContent =
            data.author_name;

        }

      }

    }
  )

  .catch(
    ()=>{}
  );

}


/* =====================================================
   CURRENT INFO
===================================================== */

function updateInfo(){

  if(
    !player ||
    !player.getVideoData
  )
    return;


  try{

    const data =
      player.getVideoData();


    if(
      !data ||
      !data.video_id
    )
      return;


    cover.src =
      `https://i.ytimg.com/vi/${data.video_id}/hqdefault.jpg`;


    if(data.title){

      title.textContent =
        data.title;

    }


    if(data.author){

      artist.textContent =
        data.author;

    }

  }catch(e){}

}


/* =====================================================
   ACTIVE SONG
===================================================== */

function highlightActive(){

  if(
    !player ||
    !player.getPlaylistIndex
  )
    return;


  const current =
    player.getPlaylistIndex();


  document
    .querySelectorAll(".song")
    .forEach(
      (item,index)=>{

        item.classList.toggle(
          "active",
          index === current
        );

      }
    );

}


/* =====================================================
   SEEK POSITION
===================================================== */

function seekPosition(x){

  const r =
    seek.getBoundingClientRect();


  return Math.max(
    0,
    Math.min(
      1,
      (x - r.left) /
      r.width
    )
  );

}


/* =====================================================
   SEEK UI
===================================================== */

function updateSeekUI(pos){

  document.getElementById(
    "fill"
  ).style.width =
    (pos * 100) + "%";


  if(
    player &&
    player.getDuration
  ){

    const d =
      player.getDuration();


    if(d){

      document.getElementById(
        "current"
      ).textContent =
        format(pos * d);

    }

  }

}


/* =====================================================
   SEEK DOWN
===================================================== */

seek.addEventListener(
  "pointerdown",
  e => {

    if(
      !player ||
      !player.getDuration()
    )
      return;


    e.preventDefault();


    isDragging = true;


    seek.setPointerCapture(
      e.pointerId
    );


    updateSeekUI(
      seekPosition(
        e.clientX
      )
    );

  }
);


/* =====================================================
   SEEK MOVE
===================================================== */

seek.addEventListener(
  "pointermove",
  e => {

    if(!isDragging)
      return;


    e.preventDefault();


    updateSeekUI(
      seekPosition(
        e.clientX
      )
    );

  }
);


/* =====================================================
   SEEK UP
===================================================== */

seek.addEventListener(
  "pointerup",
  e => {

    if(!isDragging)
      return;


    e.preventDefault();


    const pos =
      seekPosition(
        e.clientX
      );


    isDragging = false;


    updateSeekUI(
      pos
    );


    const duration =
      player.getDuration();


    if(duration){

      player.seekTo(
        pos * duration,
        true
      );

    }

  }
);


/* =====================================================
   SEEK CANCEL
===================================================== */

seek.addEventListener(
  "pointercancel",
  e => {

    if(!isDragging)
      return;


    const pos =
      seekPosition(
        e.clientX
      );


    isDragging = false;


    const duration =
      player.getDuration();


    if(duration){

      player.seekTo(
        pos * duration,
        true
      );

    }

  }
);


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

  if(isDragging)
    return;


  if(
    !player ||
    !player.getCurrentTime
  )
    return;


  try{

    const current =
      player.getCurrentTime();


    const duration =
      player.getDuration();


    if(!duration)
      return;


    const percent =
      Math.min(
        100,
        Math.max(
          0,
          (current / duration) *
          100
        )
      );


    document.getElementById(
      "fill"
    ).style.width =
      percent + "%";


    document.getElementById(
      "current"
    ).textContent =
      format(current);


    document.getElementById(
      "duration"
    ).textContent =
      format(duration);

  }catch(e){}

}


/* =====================================================
   FORMAT TIME
===================================================== */

function format(seconds){

  if(
    !seconds ||
    isNaN(seconds)
  )
    return "0:00";


  seconds =
    Math.floor(seconds);


  return(

    Math.floor(
      seconds / 60
    ) +

    ":" +

    String(
      seconds % 60
    ).padStart(
      2,
      "0"
    )

  );

}


/* =====================================================
   SWIPE
===================================================== */

const card =
  document.getElementById(
    "playerCard"
  );


card.addEventListener(
  "touchstart",
  e => {

    if(
      e.target.closest(
        ".seek"
      )
    )
      return;


    swipeStartX =
      e.changedTouches[0]
        .screenX;


    swipeStartY =
      e.changedTouches[0]
        .screenY;

  },
  {
    passive:true
  }
);


card.addEventListener(
  "touchend",
  e => {

    if(
      e.target.closest(
        ".seek"
      )
    )
      return;


    const x =
      e.changedTouches[0]
        .screenX;


    const y =
      e.changedTouches[0]
        .screenY;


    const dx =
      x - swipeStartX;


    const dy =
      y - swipeStartY;


    if(
      Math.abs(dx) <=
      Math.abs(dy)
    )
      return;


    if(dx < -50){

      nextSong();

    }else if(dx > 50){

      previousSong();

    }

  },
  {
    passive:true
  }
);


/* =====================================================
   OUTSIDE VOLUME
===================================================== */

document.addEventListener(
  "click",
  e => {

    const volume =
      document.querySelector(
        ".volume"
      );


    if(
      volume &&
      !volume.contains(
        e.target
      )
    ){

      document
        .getElementById(
          "volWrap"
        )
        .classList.remove(
          "active"
        );

    }

  }
);

</script>
